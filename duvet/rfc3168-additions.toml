quote = '''
When this document is published as an RFC, IANA should create a new registry, "TCP Header Flags", with the namespace as follows:
'''

# 3168-A036 | TCP sender | optional ECT codepoint choice
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-5"
quote = '''
Senders are free to use either the ECT(0) or the ECT(1) codepoint to indicate ECT, on a packet-by-packet basis.
'''

# 3168-A037 | TCP endpoint | multiple indications within original-flight epoch
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-5"
quote = '''
An additional goal is that the end-systems should react to congestion at most once per window of data (i.e., at most once per round-trip time), to avoid reacting multiple times to multiple indications of congestion within a round-trip time.
'''

# 3168-A038 | TCP endpoint | loss of corrupted CE data
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-5.2"
quote = '''
Similarly, if a CE packet is dropped later in the network due to corruption (bit errors), the end nodes should still invoke congestion control, just as TCP would today in response to a dropped data packet.
'''

# 3168-A039 | TCP endpoint | packet not sent as ECN-capable
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.1"
quote = '''
If the TCP connection does not wish to use ECN notification for a particular packet, the sending TCP sets the ECN codepoint to not-ECT, and the TCP receiver ignores the CE codepoint in the received packet.
'''

# 3168-A040 | TCP endpoint | negotiated fresh data
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.2"
quote = '''
For a TCP connection using ECN, new data packets are transmitted with an ECT codepoint set in the IP header.
'''

# 3168-A041 | TCP endpoint | eligible ECE ACK
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.2"
quote = '''
That is, the TCP source halves the congestion window "cwnd" and reduces the slow start threshold "ssthresh".
'''

# 3168-A042 | TCP endpoint | ECE at one-MSS cwnd
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.2"
quote = '''
The sending TCP will then be able to send a new packet only when the retransmit timer expires.
'''

# 3168-A043 | TCP endpoint | normal ACK/duplicate ACK/timeout output
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.2"
quote = '''
TCP follows existing algorithms for sending data packets in response to incoming ACKs, multiple duplicate acknowledgments, or retransmit timeouts [RFC2581].
'''

# 3168-A044 | IPv4 marking router | incremental checksum update after ECT(0)-to-CE
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-17"
quote = '''
