# Operative clauses omitted by extraction; exact RFC text, whitespace normalized only.
# External actor exceptions do not claim TCP-core implementation.

# 3168-A001 | router/AQM | network forwarding/congestion marking
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-5"
quote = '''
Routers treat the ECT(0) and ECT(1) codepoints as equivalent.
'''

# 3168-A002 | router/AQM | network forwarding/congestion marking
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-5"
quote = '''
Routers that have a packet arriving at a full queue drop the packet, just as they do in the absence of ECN.
'''

# 3168-A003 | router/AQM | network forwarding/congestion marking
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-5"
quote = '''
When a CE packet (i.e., a packet that has the CE codepoint set) is received by a router, the CE codepoint is left unchanged, and the packet is transmitted as usual.
'''

# 3168-A004 | router/AQM | network forwarding/congestion marking
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-5.1"
quote = '''
Therefore, the CE codepoint should not be set by a router based on the instantaneous queue size.
'''

# 3168-A005 | router/AQM | network forwarding/congestion marking
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-7"
quote = '''
During periods where the average queue size exceeds an upper threshold, and therefore the potential packet marking rate would be high, our recommendation is that routers drop packets rather then set the CE codepoint in packet headers.
'''

# 3168-A006 | router/AQM | network forwarding/congestion marking
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-10"
quote = '''
We recommend that any "penalty box" that detects a flow or an aggregate of flows that is not responding to end-to-end congestion control first change from marking to dropping packets from that flow, before taking any additional action to restrict the bandwidth available to that flow.
'''

# 3168-A007 | router/AQM | network forwarding/congestion marking
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-19.1"
quote = '''
ECN-capable routers should drop rather than mark packets during heavy congestion even if the router's queue is not yet full. For example, for routers using active queue management based on RED, the router should drop rather than mark packets that arrive while the average queue sizes exceed the RED queue's maximum threshold.
'''

# 3168-A008 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.1.1"
quote = '''
The limited-functionality option for ECN encapsulation in IP tunnels is for the not-ECT codepoint to be set in the outside (encapsulating) header regardless of the value of the ECN field in the inside (encapsulated) header. With this option, the ECN field in the inner header is not altered upon de-capsulation.
'''

# 3168-A009 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.1.1"
quote = '''
At tunnel ingress, the full-functionality option sets the ECN codepoint in the outer header. If the ECN codepoint in the inner header is not-ECT or ECT, then it is copied to the ECN codepoint in the outer header. If the ECN codepoint in the inner header is CE, then the ECN codepoint in the outer header is set to ECT(0). Upon decapsulation at the tunnel egress, the full-functionality option sets the CE codepoint in the inner header if the CE codepoint is set in the outer header. Otherwise, no change is made to this field of the inner header.
'''

# 3168-A010 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.1.2"
quote = '''
If the IP tunnel uses the full-functionality option, then the not-ECT codepoint should be set in the outer header if and only if it is also set in the inner header.
'''

# 3168-A011 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.1.2"
quote = '''
If the tunnel uses the limited-functionality option, then the not-ECT codepoint should be set in the outer header.
'''

# 3168-A012 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.2"
quote = '''
if it is necessary to eliminate such a channel or reduce its bandwidth, then the IPsec tunnel should be run in limited-functionality mode.
'''

# 3168-A013 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.2.1.2"
quote = '''
If unspecified, the default shall be assumed to be Forbidden.
'''

# 3168-A014 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.2.1.3"
quote = '''
(7) If the value of the ECN Tunnel field in the SAD entry for this SA is "allowed" and the ECN field in the inner header is set to any value other than CE, copy this ECN field to the outer header. If the ECN field in the inner header is set to CE, then set the ECN field in the outer header to ECT(0).
'''

# 3168-A015 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.2.1.3"
quote = '''
(8) If the value of the ECN tunnel field in the SAD entry for this SA is "allowed" and the ECN field in the inner header is set to ECT(0) or ECT(1) and the ECN field in the outer header is set to CE, then copy the ECN field from the outer header to the inner header. Otherwise, make no change to the ECN field in the inner header.
'''

# 3168-A016 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.2.1.3"
quote = '''
(7) Set the ECN field to not-ECT in the outer header.
'''

# 3168-A017 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.2.1.3"
quote = '''
(8) Make no change to the ECN field in the inner header.
'''

# 3168-A018 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-9.2.2"
quote = '''
If the ECN Field is changed inappropriately within an IPsec tunnel, and this change is detected at the tunnel egress, then the receipt of a packet not satisfying the appropriate condition for its SA is an auditable event.
'''

# 3168-A019 | IP/IPsec tunnel ingress/egress | selected tunnel mode/policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-12"
quote = '''
When ECN (Explicit Congestion Notification) is used, it is required that congestion indications generated within an IP tunnel not be lost at the tunnel egress.
'''

# 3168-A020 | IP reassembler | CE-bearing fragment reassembly alternative
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-5.3"
quote = '''
* The packet is dropped, instead of being reassembled, for any other reason.
'''

# 3168-A021 | IP adapter | IPv4 and IPv6 traffic class encoding
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-5"
quote = '''
Bits 6 and 7 in the IPv4 TOS octet are designated as the ECN field. The IPv4 TOS octet corresponds to the Traffic Class octet in IPv6, and the ECN field is defined identically in both cases.
'''

# 3168-A022 | TCP endpoint | selected mitigation
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1"
quote = '''
Bit 9 in the Reserved field of the TCP header is designated as the ECN-Echo flag.
'''

# 3168-A023 | TCP endpoint | selected mitigation
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1"
quote = '''
The CWR flag is assigned to Bit 8 in the Reserved field of the TCP header.
'''

# 3168-A024 | TCP endpoint | ECN setup followed by local plain-SYN fallback
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.1"
quote = '''
However, the commitment to respond appropriately to incoming packets with the CE codepoint set remains even if the TCP sender in a later transmission, within this TCP connection, sends a SYN packet without ECE and CWR set.
'''

# 3168-A025 | TCP endpoint | terminal state/reused tuple
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.1"
quote = '''
When a TCP host enters TIME-WAIT or CLOSED state, it should ignore any previous state about the negotiation of ECN for that connection.
'''

# 3168-A026 | TCP endpoint | ECT packet without bilateral setup
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.1.1"
quote = '''
a host is forbidden from using the reception of ECT data packets as an implicit signal that the other host is ECN- capable.
'''

# 3168-A027 | TCP endpoint | SYN-ACK reflects both ECE/CWR
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.1.2"
quote = '''
the sending TCP correctly interprets a receiver's reflection of its own flags in the Reserved field as an indication that the receiver is not ECN-capable.
'''

# 3168-A028 | TCP endpoint | mixed ECN/loss epoch and lost retransmission
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.2"
quote = '''
TCP should not react to congestion indications more than once every window of data (or more loosely, more than once every round-trip time). That is, the TCP sender's congestion window should be reduced only once in response to a series of dropped and/or CE packets from a single window of data. In addition, the TCP source should not decrease the slow-start threshold, ssthresh, if it has been decreased within the last round trip time. However, if any retransmitted packets are dropped, then this is interpreted by the source TCP as a new instance of congestion.
'''

# 3168-A029 | TCP endpoint | any reduction cause including timeout, fast retransmit and ECN
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.2"
quote = '''
When an ECN-Capable TCP sender reduces its congestion window for any reason (because of a retransmit timeout, a Fast Retransmit, or in response to an ECN Notification), the TCP sender sets the CWR flag in the TCP header of the first new data packet sent after the window reduction.
'''

# 3168-A030 | TCP endpoint | CE data including delayed-ACK aggregation
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.3"
quote = '''
When TCP receives a CE data packet at the destination end-system, the TCP data receiver sets the ECN-Echo flag in the TCP header of the subsequent ACK packet. If there is any ACK withholding implemented, as in current "delayed-ACK" TCP implementations where the TCP receiver can send an ACK for two arriving data packets, then the ECN-Echo flag in the ACK packet will be set to '1' if the CE codepoint is set in any of the data packets being acknowledged. That is, if any of the received data packets are CE packets, then the returning ACK has the ECN-Echo flag set.
'''

# 3168-A031 | TCP endpoint | echo persistence until CWR and later CE
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.3"
quote = '''
After a TCP receiver sends an ACK packet with the ECN-Echo bit set, that TCP receiver continues to set the ECN-Echo flag in all the ACK packets it sends (whether they acknowledge CE data packets or non-CE data packets) until it receives a CWR packet (a packet with the CWR flag set). After the receipt of the CWR packet, acknowledgments for subsequent non-CE data packets do not have the ECN-Echo flag set.
'''

# 3168-A032 | TCP endpoint | ACKs without ECE
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-6.1.2"
quote = '''
TCP also follows the normal procedures for increasing the congestion window when it receives ACK packets without the ECN-Echo bit set [RFC2581].
'''

# 3168-A033 | TCP endpoint | default IP/TCP output ECN policy
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-21"
quote = '''
the not-ECT codepoint should be the default.
'''

# 3168-A034 | IANA | publication registry allocation
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc3168#section-23.1"
quote = '''
When this document is published as an RFC, IANA should create a new registry, "IPv4 TOS Byte and IPv6 Traffic Class Octet", with the namespace as follows:
'''

