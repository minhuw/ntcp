[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-4.2"
reason = "Meta-level clarification of RFC1122 requirement strength, not a separate packet algorithm or instruction to implement historical MUST and SHOULD simultaneously. Operative second-full-segment/500ms behavior is audited and annotated independently; deviations cannot be justified by this exception."
quote = '''
Here we unambiguously state it is a SHOULD.
'''

# 5681-039
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-4.2"
reason = "Meta-level clarification of RFC1122 requirement strength, not a separate packet algorithm or instruction to implement historical MUST and SHOULD simultaneously. Operative second-full-segment/500ms behavior is audited and annotated independently; deviations cannot be justified by this exception."
quote = '''
