# 5681-046
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-4.3"
reason = "Exact receiver-driven wire observations in half_flight_segment_output_observations: ten originals at SMSS1/13/128; NewReno emits one full-SMSS retry in each of the first two recovery RTTs; non-RACK/non-PRR SACK without duplex SACK output emits five full-SMSS retries. With an out-of-order duplex byte requiring a 12-byte outgoing SACK option, fixed path budget33/SMSS13 emits 53 one-byte retries in one poll burst before any retry RTT completes; budget148/SMSS128 emits nine packets (116-byte prefixes and 12-byte suffixes), while holes remain. RFC6675 section5(C) byte gating (cwnd-pipe>=SMSS) and actual-byte pipe increments prescribe these admissions but do not prove RFC5681 section4.3 literal half-flight packet count. Retain the concrete packetization/algorithm applicability gap: no compliant packet-count limiter is specified by the selected RFC6675 algorithm, and RFC8985 section9.3 does not waive congestion control. Do not infer a strict PRR defect: zero-entry credit and zero-window epoch cancellation are already fixed; initial-floor/uncounted-persist reasons apply only to excluded LegacyInitialCredit compatibility. General small-flight/lost-copy multi-RTT packet-count proof remains unestablished."
quote = '''
Second, until all lost segments in the window of data in question are repaired, the number of segments transmitted in each RTT MUST be no more than half the number of outstanding segments when the loss was detected.
'''

# 5681-049
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-7"
reason = "Historical changelog reports prior MAY versus new SHOULD; not a second initialization algorithm. Operative section3.1 initial-high-ssthresh assertion and first-loss reduction are covered by newreno_initial_boundary_and_loss_epoch_are_distinct; this historical exception does not waive the operative obligation."
quote = '''
The recommended initial value for ssthresh has been changed to say that it SHOULD be arbitrarily high, where it was previously MAY.
'''

# 5681-050
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-7"
reason = "Historical restatement of optional section3.2 artificial-inflation cap, not a mandatory defense. Cap is not selected; on_duplicate_ack implements uncapped SMSS additions with numeric saturation. Mandatory ACK eligibility/global bounds retain their own TODOs."
quote = '''
TCPs now MAY limit the number of duplicate ACKs that artificially inflate cwnd during loss recovery to the number of segments outstanding to avoid the duplicate ACK spoofing attack described in [SCWA99].
'''

# 5681-060
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-3.1"
reason = "Unselected optional equation(3): shared congestion controller selects recommended byte counting, tested by initial_slow_start_and_byte_counting; no quotient or additive constant branch exists. Mandatory byte-count and per-RTT obligations retain their own evidence/TODOs."
quote = '''
cwnd += SMSS*SMSS/cwnd (3)
'''

# 5681-069
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-7"
reason = "Historical summary, not an independent algorithm. Slow-start/byte-counting, repeated RTO, Limited Transmit and advanced recovery operative clauses are audited in sections3.1/3.2/4.3/5; their TODOs remain. Rejected erratum2269 does not remove Limited Transmit recommendation."
quote = '''
During slow start, the usage of Appropriate Byte Counting [RFC3465] with L=1*SMSS is explicitly recommended. The method of increasing cwnd given in [RFC2581] is still explicitly allowed. Byte counting during congestion avoidance is also recommended, while the method from [RFC2581] and other safe methods are still allowed.
'''

# 5681-070
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-7"
reason = "Historical summary, not an independent algorithm. Slow-start/byte-counting, repeated RTO, Limited Transmit and advanced recovery operative clauses are audited in sections3.1/3.2/4.3/5; their TODOs remain. Rejected erratum2269 does not remove Limited Transmit recommendation."
quote = '''
The treatment of ssthresh on retransmission timeout was clarified. In particular, ssthresh must be set to half the FlightSize on the first retransmission of a given segment and then is held constant on subsequent retransmissions of the same segment.
'''

