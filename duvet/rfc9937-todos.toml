feature = "RFC9937-rwnd"
reason = "Literal applicability gap, not a PRR credit defect: transmit/retry_limit and ordinary_output_policy_matrix, selected_recovery_output_policy_matrix, rfc9937_safe_ack_short_output_window_stall_and_ending_ack bound ordinary/new and active-PRR output by rwnd. However scaled_retry_wire_commit_partial_ack_and_persist_are_independent permits original-valid old-data retries beyond a shrunken window, and probe_and_shrink_output_policy_matrix emits a prescribed zero-window probe after PRR cancellation. Reconcile this unqualified definition with RFC9293 section3.8.6.1 before claiming all-path literal compliance; do not silently exempt all recovery."
quote = '''
At any given time, a connection MUST
NOT send data with a sequence number higher than the sum of
SND.UNA and rwnd.
'''

