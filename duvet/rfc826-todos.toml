reason = "ntcp-arp builds the reply (fields swapped, local hardware and protocol addresses as sender, ar$op REPLY) and next_control yields it for the receiving link, unicast to the requester's sender hardware address; transmitting it on that link is the embedding's, pending the ntcp-host/ntcp-native integration."
quote = '''
?Is the opcode ares_op$REQUEST? (NOW look at the opcode!!) Yes: Swap hardware and protocol fields, putting the local hardware and protocol addresses in the sender fields. Set the ar$op field to ares_op$REPLY Send the packet to the (new) target hardware address on the same hardware on which the request was received.
'''

