# Clauses whose transmission side waits for the ntcp-host/ntcp-native
# integration, and Linux-default departures from the memo's algorithm.

[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc826#name-abstract"
reason = "Linux arp_accept=0 default: a request for a local or published address adds its sender (STALE, as neigh_event_ns), but a reply or gratuitous announcement targeting this node from an uncached sender adds no entry, so unsolicited packets cannot fill the bounded table; a cached sender is still merged. Tests requests_for_answered_addresses_add_their_sender_as_stale and cached_senders_are_merged_whatever_the_target_or_opcode."
quote = '''
?Am I the target protocol address? Yes: If Merge_flag is false, add the triplet <protocol type, sender protocol address, sender hardware address> to the translation table.
'''

[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc826#name-abstract"
reason = "Dynamic entries are superseded by the new hardware address (a changed mapping becomes STALE, or REACHABLE when it answers this node's request). Administratively configured Permanent entries are never superseded by learning, as Linux NUD_PERMANENT; the departure is limited to static configuration. Tests cached_senders_are_merged_whatever_the_target_or_opcode and permanent_entries_are_never_overwritten_or_evicted."
quote = '''
Notice also that if an entry already exists for the <protocol type, sender protocol address> pair, then the new hardware address supersedes the old one.
'''

