# Open semantic/test gaps and explicitly scoped optional/actor exceptions.

# 6928-001
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Explicit user-approved implementation-audit scope exception: before/after performance monitoring is owed by the vendor/operator enabling IW10 in a deployment, not by the runtime implementation audit. No deployment measurements or satisfaction are claimed. IW10 remains default-disabled and user-selected; bounded sender cache/fallback and timer obligations retain implementation evidence. Deployment actor must still monitor before/after enabling IW10 or justify a SHOULD departure; external instrumentation suffices."
quote = '''
Anyone (stack vendors, network administrators, etc.) turning on a larger initial window SHOULD ensure that the performance is monitored before and after that change.
'''

# 6928-003
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Conditional instruction to deployment users observing service deterioration: they must disable IW10/use RFC3390 at deployment. This library neither observes application media quality nor operates a deployment; users can select Rfc5681 per ConnectionConfig. No deployment result is claimed; Bounded inferred-loss sender cache/fallback is implemented; vendor deployment monitoring is excluded from this implementation audit, not satisfied."
quote = '''
If users observe any significant deterioration of performance, they SHOULD fall back to an initial window as allowed by RFC 3390 for safety reasons.
'''

# 6928-006
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-2"
reason = "This is an indented quotation of the previous RFC3390 rule being revised, not a new RFC6928 mandate. Default RFC5681 loss requirement is separately evidenced; opt-in IW10 now retains IW after one committed SYN/SYNACK retry and reduces after more than one, without claiming physical loss proof."
quote = '''
If the SYN or SYN/ACK is lost, the initial window used by a sender after a correctly transmitted SYN MUST be one segment consisting of MSS bytes.
'''

# 6928-014
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-2"
reason = "IW10 with default or configured >=1s sampled floor inherits implemented RFC6298 estimator, Karn-safe causal-round sampling, selected loss timer, per-copy age/boundary safeguards and backoff. Evidence: rto_variable_packets_partial_ack_fresh_tail_and_failed_output, rtt_cadence_continuous_delayed_stretched_and_same_tick, iw10_loss_fallback_boundaries_restart_and_new_ack_timer and tlp_small_rto_floor_preserves_initial_and_syn_timeout_guard. Scope exception only for IW10 combined with explicitly user-selected subsecond rto_min_us: approved Linux compatibility departs from RFC6298 section2.4 SHOULD rounding and may be more aggressive; no universal inherited RFC6298 MUST pass is claimed. Default1s, initial1s and post-SYN-timeout3s safeguards remain."
quote = '''
Implementations must also follow RFC 6298 [RFC6298] in order to avoid spurious RTO as described in Section 9.
'''

# 6928-015
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-1"
reason = "ConnectionConfig implements settable Rfc5681/Iw10 selection, with default-disabled IW10 and explicit opt-in evidenced by source/tests. Explicit user-approved implementation-audit scope exception only for deployment monitoring effort and application/service interactions: enabling vendors/operators retain that obligation outside this audit. No deployment safety/monitoring result or evidence supporting IW>10 is claimed; the implemented IW10 bound, cache/fallback and timer requirements are not excluded."
quote = '''
We recommend that all TCP implementations have a settable TCP IW parameter, as long as there is a reasonable effort to monitor for possible interactions with other Internet applications and services as described in Section 12. Furthermore, Section 10 details why 10 segments may be an appropriate value, and while that value may continue to rise in the future, this document does not include any supporting evidence for values of IW larger than 10.
'''

# 6928-016
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-2"
reason = "Research validation of non-Ethernet MTU impacts is an experiment-design task, not a transport algorithm requirement. Unit MSS/jumbo/path-budget vectors verify arithmetic only, not fairness or real-network validation; no deployment safety result is claimed."
quote = '''
Note that all the test results described in this document were based on the regular Ethernet MTU of 1500 bytes. Future study of the effect of a different MTU may be needed to fully validate (1) above.
'''

# 6928-017
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-3"
reason = "Content-provider actor must measure domain-sharded application concurrency and consider reducing parallel retrievals. This TCP library is neither a content provider nor an HTTP scheduling implementation; sender implementation obligations remain audited; stack-vendor deployment monitoring is separately excluded, not satisfied."
quote = '''
When web browsers open simultaneous TCP connections to the same destination, they are working against TCP's congestion control mechanisms [FF99]. Combining this behavior with larger initial windows further increases the burstiness and unfairness to other traffic in the network. If a larger initial window causes harm to any other flows, then local application tuning will reveal that having fewer concurrent connections yields better performance for some users. Any content provider deploying IW10 in conjunction with content distributed across multiple domains is explicitly encouraged to perform measurement experiments to detect such problems, and to consider reducing the number of concurrent connections used to retrieve their content.
'''

# 6928-019
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-4"
reason = "HTTP browser/application concurrency actor, not a TCP transport library. ntcp does not create HTTP requests or allocate domains; no application-concurrency conformance is claimed. IW10 sender implementation obligations remain audited; vendor monitoring is separately excluded, not satisfied."
quote = '''
we argue that the browsers and other application need to respect HTTP 1.1 regulation and stop increasing the number of simultaneous TCP connections.
'''

# 6928-020
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-4"
reason = "Explicitly optional/non-required pacing; no pacing implementation is claimed. Absence of pacing cannot waive IW10 byte bound, loss window, fallback or monitoring requirements."
quote = '''
Pacing is not required in this proposal due to a strong preference for a simple solution.
'''

# 6928-022
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Internet-wide default experiment/research prerequisite is outside a library annotation audit: no default IW10 rollout is proposed, and default prohibition is separately evidenced. Researchers/deployers still owe experiments before broader default enablement; this is not a safety waiver for opt-in sender obligations."
quote = '''
Further experiments are required before a larger initial window shall be enabled by default in the Internet. The existing measurement results indicate that this does not cause significant harm to other traffic. However, widespread use in the Internet could reveal issues not known yet, e.g., regarding fairness or impact on latency- sensitive traffic such as VoIP.
'''

# 6928-023
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Explicit user-approved implementation-audit scope exception: deployment actors enabling IW10 must monitor initial-burst packet-loss, ECN-marking and retransmission rates using deployment instrumentation. This audit excludes descriptions/evidence of deployment monitoring, not implementation loss/ECN/retransmission behavior or bounded sender fallback. No rates, production measurements or deployment satisfaction are claimed; no mandatory built-in telemetry API is inferred."
quote = '''
Key metrics to monitor are the rate of packet losses, ECN marking, and segment retransmissions during the initial burst.
'''

# 6928-024
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Operational/application metric assessment includes transfer completion and media quality, not observable inside this transport library alone. Deployment operators must compare workload behavior; no such deployment has been audited. Bounded sender cache/fallback is implemented; vendor initial-burst monitoring remains TODO."
quote = '''
Other relevant metrics that may indicate a need to reduce the IW include an increased overall percentage of packet loss or segment retransmissions as well as application-level metrics such as reduced data transfer completion times or impaired media quality.
'''

# 6928-025
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Deployment experiment designers must assess mixed-IW and real-time cross-traffic; this library does not operate the network experiment or VoIP workload. No deployment safety evidence is claimed. Default prohibition and sender fallback/monitoring retain their own records."
quote = '''
It is important also to take into account hosts that do not implement a larger initial window. Furthermore, any deployment of IW10 should be aware that there are potential side effects to real-time traffic (such as VoIP).
'''

# 6928-026
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Publishing measurements and studying real-time traffic are tasks for experiment researchers/TCPM participants, not TCP runtime behavior. No experiment results are invented or claimed; vendor deployment monitoring is excluded from this implementation audit, not satisfied; bounded sender fallback is implemented."
quote = '''
The IETF TCPM working group is very much interested in further reports from experiments with this specification and encourages the publication of such measurement data. By now, there are no adequate studies available that either prove or do not prove the impact of IW10 to real-time traffic. Further experimentation in this direction is encouraged.
'''

# 6928-027
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Network-wide flow observation actor is network researchers/operators, beyond this endpoint library. This does not excuse the library sender cache/fallback SHOULD or the enabling actor's deployment-monitoring obligations outside this audit; external instrumentation is sufficient."
quote = '''
As use of IW10 becomes more prevalent, monitoring and analysis of flows throughout the network will be needed to assess the impact across the spectrum of scenarios found on the real Internet.
'''

# 6928-028
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-13"
reason = "Long-timescale startup research is directed to TCP research community, not a required algorithm to implement in this bounded IW10 profile. No adaptive long-term IW mechanism is claimed."
quote = '''
Although a modest, static increase of IW to 10 may address the near- term need for better web performance, much work is needed from the TCP research community to find a long-term solution to the TCP flow startup problem.
'''

# 6928-029
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-1.1"
reason = "BCP14 vocabulary declaration is interpreted by specification readers/auditors. This does not waive the experimentally opted-in stack obligations; MAY choice and conditional SHOULD/MUST are recorded separately."
quote = '''
The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this document are to be interpreted as described in RFC 2119 [RFC2119].
'''

# 6928-030
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-7"
reason = "Fairness evaluation between IW10 and baseline flows is a network research/experiment task. No empirical fairness evidence is claimed for this library; opt-in deployment monitoring is excluded from this implementation audit, not satisfied; bounded cache/fallback is implemented."
quote = '''
Although no severe unfairness has been detected on all the known tests so far, further study on this topic may be warranted.
'''

# 6928-031
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Research invitation to evaluate sender cache designs, not permission to omit the preceding sender-cache/fallback SHOULD. That implementation obligation is addressed by bounded loss-inference cache/fallback; this record only excludes publication/experimental study from TCP runtime role."
quote = '''
Further experiments are needed on the design of such a cache and corresponding heuristics.
'''
