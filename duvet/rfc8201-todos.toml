# Clause-specific implementation/test gaps and true actor/alternative exceptions.

# 8201-025b
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-3"
reason = "Forwarding-node discard/ICMPv6 generation actor; this unicast TCP endpoint does not act as a router."
quote = '''
If any of the packets sent on that path are too large to be forwarded by some node along the path, that node will discard them and return ICMPv6 Packet Too Big messages.
'''

# 8201-027
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-3"
reason = "Optional terminate-discovery-at-minimum mode is not selected in enabled PMTUD; selected TCP PLPMTUD continues ACK-confirmed search. Connections configured without discovery independently enforce the IPv6 minimum-MTU send ceiling."
quote = '''
Alternatively, the node may elect to end the discovery process by ceasing to send packets larger than the IPv6 minimum link MTU.
'''

# 8201-028b
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-3"
reason = "Classical blind periodic estimate increases are not selected; ACK-confirmed RFC4821 probes reopen after a ten-minute hold. RFC8201 section1 identifies this extension and RFC4821 section1 relaxes classical algorithms. No exception to PTB holdoff or congestion control."
quote = '''
To detect increases in a path's PMTU, a node periodically increases its assumed PMTU. This will almost always result in packets being discarded and Packet Too Big messages being
'''

# 8201-029
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-3"
reason = "Continuation of the unselected blind-increase mechanism in 8201-028b. Selected RFC4821 active search is ACK-confirmed; accepted PTB and converged search retain ten-minute timers (8201-038/068). RFC4821 section1 is the narrow algorithm basis, not a general conformance waiver."
quote = '''
generated, because in most cases the PMTU of the path will not have changed. Therefore, attempts to detect increases in a path's PMTU should be done infrequently.
'''

# 8201-030
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-3"
reason = "Multicast path aggregation is outside unicast TCP; no multicast transport implementation is claimed."
quote = '''
Path MTU Discovery supports multicast as well as unicast destinations. In the case of a multicast destination, copies of a packet may traverse many different paths to many different nodes. Each path may have a different PMTU, and a single multicast packet may result in multiple Packet Too Big messages, each reporting a different next-hop MTU. The minimum PMTU value across the set of paths in use determines the size of subsequent packets sent to the multicast destination.
'''

# 8201-031
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-3"
reason = "The enabled core has no same-link bypass. ipv6_same_prefix_proxy_wire_path_does_not_bypass_downstream_ptb already verifies 1500-to-1280 feedback, bounded repair and real receiver progress for a same-/64 peer, but explicitly does not exercise Neighbor Discovery, proxy configuration or route selection. Applicability to a node actually treating a proxied destination as on-link remains unestablished; this is not a native-IPv6-socket requirement."
quote = '''
Note that Path MTU Discovery must be performed even in cases where a node "thinks" a destination is attached to the same link as itself, as it might have a PMTU lower than the link MTU. In a situation such as when a neighboring router acts as proxy [ND] for some destination, the destination can appear to be directly connected, but it is in fact more than one hop away.
'''

# 8201-050
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.1"
reason = "T7 PathService checks complete caller-provided IPv6 header budgets; T8 Host applies actual base-header budgets in native/TUN factories and reserved submission, and T10 Host UDP flows read MMS_S. T13 supplies source fragmentation and reassembly: Host::udp_send_datagram's Fragment mode bounds a datagram by the receiver's reassembly guarantee (1500 octets for IPv6) or a capability the application states from upper-layer or deployment knowledge, and creates fragments each limited by the connectionless effective size (never above the PMTU); Refuse mode and TCP keep EMTU_S at the PMTU (TCP never source-fragments); Host::reassembly_capacity states this Host's own EMTU_R and MMS_R. Remaining: T17 owns complete IPv6 extension-header parsing and encoding, so MMS_S subtracts extension headers beyond the Fragment header, and T16 owns the receive-side indication by which this Host's upper layer states its capacity (the receive MSS derived from EMTU_R/MMS_R, whose TCP payload unit differs from both). Source fragmentation is conditional in the preserved whole quote."
quote = '''
MMS_S is a transport message size calculated by subtracting the size of the IPv6 header (including IPv6 extension headers) from the largest IP packet that can be sent, EMTU_S. MMS_S is limited by a combination of factors, including the PMTU, support for packet fragmentation and reassembly, and the packet reassembly limit (see "Fragment Header", Section 4.5 of [RFC8200]). When source fragmentation is available, EMTU_S is set to EMTU_R, as indicated by the receiver using an upper-layer protocol or based on protocol requirements (1500 octets for IPv6). When a message larger than PMTU is to be transmitted, the source creates fragments, each limited by PMTU. When source fragmentation is not desired, EMTU_S is set to PMTU, and the upper-layer protocol is expected to either perform its own fragmentation and reassembly or otherwise limit the size of its messages accordingly.
'''

# 8201-052
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.2"
reason = "T7 PathService maintains independent canonical IPv6 source/destination/link generations, including equal link-local octets on different links. T8 Host uses canonical bindings in actual native/TUN unscoped TCP processing. Actual Endpoint/native zone propagation and multi-link ND remain T18; typed library identities alone do not establish that runtime capability."
quote = '''
Ideally, a PMTU value should be associated with a specific path traversed by packets exchanged between the source and destination nodes. However, in most cases a node will not have enough information to completely and accurately identify such a path. Rather, a node must associate a PMTU value with some local representation of a path. It is left to the implementation to select the local representation of a path. For nodes with multiple interfaces, Path MTU information should be maintained for each IPv6 link.
'''

# 8201-053
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.2"
reason = "Multicast path aggregation is outside unicast TCP; no multicast transport implementation is claimed."
quote = '''
In the case of a multicast destination address, copies of a packet may traverse many different paths to reach many different nodes. The local representation of the "path" to a multicast destination must represent a potentially large set of paths.
'''

# 8201-054
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.2"
reason = "Alternative global/destination/flow-label/source-route cache keys are not selected; Connection-local tuple is the path representation. Shared-cache and IPv6 routing-header recommendations retain TODOs."
quote = '''
Minimally, an implementation could maintain a single PMTU value to be used for all packets originated from the node. This PMTU value would be the minimum PMTU learned across the set of all paths in use by the node. This approach is likely to result in the use of smaller packets than is necessary for many paths. In the case of multipath routing (e.g., Equal-Cost Multipath Routing (ECMP)), a set of paths can exist even for a single source and destination pair.
'''

# 8201-055
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.2"
reason = "Alternative global/destination/flow-label/source-route cache keys are not selected; Connection-local tuple is the path representation. Shared-cache and IPv6 routing-header recommendations retain TODOs."
quote = '''
An implementation could use the destination address as the local representation of a path. The PMTU value associated with a destination would be the minimum PMTU learned across the set of all paths in use to that destination. This approach will result in the use of optimally sized packets on a per-destination basis. This approach integrates nicely with the conceptual model of a host as described in [ND]: a PMTU value could be stored with the corresponding entry in the destination cache.
'''

# 8201-056
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.2"
reason = "Alternative global/destination/flow-label/source-route cache keys are not selected; Connection-local tuple is the path representation. Shared-cache and IPv6 routing-header recommendations retain TODOs."
quote = '''
If flows [RFC8200] are in use, an implementation could use the flow id as the local representation of a path. Packets sent to a particular destination but belonging to different flows may use different paths, as with ECMP, in which the choice of path might depend on the flow id. This approach might result in the use of optimally sized packets on a per-flow basis, providing finer granularity than PMTU values maintained on a per-destination basis.
'''

# 8201-057
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.2"
reason = "Alternative global/destination/flow-label/source-route cache keys are not selected; Connection-local tuple is the path representation. Shared-cache and IPv6 routing-header recommendations retain TODOs."
quote = '''
For source-routed packets (i.e. packets containing an IPv6 Routing header [RFC8200]), the source route may further qualify the local representation of a path.
'''

# 8201-060
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.2"
reason = "The IPv6 quote decoder accepts no extension header other than a Fragment header directly after the base header and does not locate the final destination through a Routing Header/Segments Left. This is a concrete unsupported-header gap, not generic cache fanout."
quote = '''
Note: if the original packet contained a Routing header, the Routing header should be used to determine the location of the destination address within the original packet. If Segments Left is equal to zero, the destination address is in the Destination Address field in the IPv6 header. If Segments Left is greater than zero, the destination address is the last address (Address[n]) in the Routing header.
'''

# 8201-061
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.2"
reason = "Literal section5.2 prose suggests clamping a sub1280 report, but section4 explicitly requires discarding it; the implementation follows section4 (8201-034). Legal decreasing values are applied. Retain this textual inconsistency explicitly rather than claim the complete clamping algorithm or invent a missing cache requirement."
quote = '''
The node then uses the value in the MTU field in the Packet Too Big message as a tentative PMTU value or the IPv6 minimum link MTU if that is larger, and compares the tentative PMTU to the existing PMTU. If the tentative PMTU is less than the existing PMTU estimate, the tentative PMTU replaces the existing PMTU as the PMTU value for the path.
'''

# 8201-065
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.2"
reason = "Unselected alternative that defers PMTU-decrease notification until SEND fails, suggested especially for UDP. TCP uses validated feedback and immediate packetization refresh instead; shared-path fanout and dropped-packet notification are audited separately."
quote = '''
Note: An implementation can avoid the use of an asynchronous notification mechanism for PMTU decreases by postponing notification until the next attempt to send a packet larger than the PMTU estimate. In this approach, when an attempt is made to SEND a packet that is larger than the PMTU estimate, the SEND function should fail and return a suitable error indication. This approach may be more suitable to a connectionless packetization layer (such as one using UDP), which (in some implementations) may be hard to "notify" from the ICMPv6 layer. In this case, the normal timeout-based retransmission mechanisms would be used to recover from the dropped packets.
'''

# 8201-076
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.4"
reason = "Implemented operative behavior: a PTB indicating a lost PMTU probe is not a congestion notification. Probe attribution invalidates the probe size for Unchanged, Deferred, Decreased and older-incarnation reports alike while finite isolated-probe proof survives, a congestion-loss response is suppressed only after receiver delivery and recovery exit, and neither the PTB nor its exact-range repair reduces cwnd or ssthresh, enters or extends recovery or starts PRR. Accepted lower PMTU still calls refresh_path_mss and Congestion::set_mss, rescaling the byte congestion window when MSS decreases; the dual-family receiver matrix asserts that ratio. Remaining (T23, AC-27): only the standards decision whether that RFC 5681/RFC 4821 MSS-decrease rescaling conflicts with \"the congestion window may not change\"; required MSS rescaling is preserved."
quote = '''
A loss caused by a PMTU probe indicated by the reception of a Packet Too Big message must not be considered as a congestion notification, and hence the congestion window may not change.
'''

# 8201-077
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.5"
reason = "Actor not implemented: no transport in this stack has a stack-managed non-repacketizing retransmission algorithm (TCP repacketizes its retransmissions and never enters source fragmentation). The Host IP layer does fragment: Host::udp_send_datagram's Fragment mode source-fragments a UDP datagram larger than the connectionless effective size (base header, Fragment header, upper layer; every fragment within that size), so a datagram application that resends a datagram unchanged has it fragmented by the Host."
quote = '''
Some transport protocols are not allowed to repacketize when doing a retransmission. That is, once an attempt is made to transmit a segment of a certain size, the transport cannot split the contents of the segment into smaller segments for retransmission. In such a case, the original segment can be fragmented by the IP layer during retransmission. Subsequent segments, when transmitted for the first time, should be no larger than allowed by the Path MTU.
'''

# 8201-078a
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc8201#section-5.5"
reason = "NFS transport-selection actor: ntcp supplies TCP, not an NFS implementation choosing its transport."
quote = '''
Since then, [RFC7530] states that the supported transport layer between NFS and IP must be an IETF standardized transport protocol that is specified to avoid network congestion; such transports include TCP, Stream Control Transmission Protocol (SCTP) [RFC4960], and the Datagram Congestion Control Protocol (DCCP) [RFC4340].
'''

