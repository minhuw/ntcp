# 9438-undo-save
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc9438#section-4.9.2"
reason = "Optional CUBIC spurious-event detection/state undo is unselected: no saved undo state or CUBIC restoration is implemented. D-SACK/RACK reordering adaptation does not select this optional CUBIC undo algorithm. The conditional high-cwnd preserve rule and save/restore equations apply only if that option is selected; no undo conformance is claimed. Reviewed candidate code/tests: crates/ntcp/src/cubic.rs::Cubic; crates/ntcp/src/recovery.rs::Congestion."
quote = '''
undo_cwnd =      cwnd
                        undo_cwnd      = cwnd
                                 prior       prior
                        undo_ssthresh =  ssthresh
                        undo_W    =      W
                              max         max
                        undo_K =         K
                        undo_t      =    t
                              epoch       epoch
                        undo_W    =      W
                              est         est
'''

# 9438-undo-restore
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc9438#section-4.9.2"
reason = "Optional CUBIC spurious-event detection/state undo is unselected: no saved undo state or CUBIC restoration is implemented. D-SACK/RACK reordering adaptation does not select this optional CUBIC undo algorithm. The conditional high-cwnd preserve rule and save/restore equations apply only if that option is selected; no undo conformance is claimed. Reviewed candidate code/tests: crates/ntcp/src/cubic.rs::Cubic; crates/ntcp/src/recovery.rs::Congestion."
quote = '''
cwnd =      undo_cwnd      ⎫
              cwnd      = undo_cwnd      ⎮
                  prior            prior ⎮
              ssthresh =  undo_ssthresh  ⎮
              W    =      undo_W         ⎮
               max              max      ⎬if cwnd < cwnd
              K =         undo_K         ⎮              prior
              t      =    undo_t         ⎮
               epoch            epoch    ⎮
              W    =      undo_W         ⎮
               est              est      ⎭
'''

