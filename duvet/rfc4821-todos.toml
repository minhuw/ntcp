# 4821-018
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-2"
reason = "Unselected ICMP-free deployment alternative: this stack retains validated PTB processing alongside PLPMTUD. The paragraph does not require an ICMP-disable knob."
quote = '''
In the limiting case, all ICMP PTB messages might be unconditionally ignored, and PLPMTUD can be used as the sole method to discover the Path MTU. In this configuration, PLPMTUD parallels congestion control. An end-to-end transport protocol adjusts properties of the data stream (window size or packet size) while using packet losses to deduce the appropriateness of the adjustments. This technique seems to be more philosophically consistent with the end-to-end principle of the Internet than relying on ICMP messages containing transcribed headers of multiple protocol layers.
'''

# 4821-019
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-2"
reason = "PathService is the IP-layer path information cache shared by the Host's packetization protocols. TCP runs its own PLPMTUD, reads the cache through Host::service_changes budget application and updates it with correlated PTBs and with probe-confirmed sizes (a definitely submitted, unfragmented probe selected after the hold whose span the peer acknowledged, published through PathService::confirm_delivery). A correlated TCP report about the connection's current path at or above its proven delivery lowers the cache at once when lower and otherwise restarts its hold; one below proven delivery is deferred whatever the connection's loss-inferred estimate and changes nothing shared until that exact report's quoted-data timeout applies it, when the larger of the Host estimate and the report's own policy-derived size is published; cumulative progress past the quoted data refutes it. The report's derived size never depends on the connection's estimate: a legacy IPv4 report without a Next-Hop MTU is corrected against the Host's shared path estimate, RFC 1191 section 5's current PMTU estimate, never the connection's estimate. Loss-inferred decreases stay connection-local. Host UDP flows read MMS_S and the payload limit (Host::udp_path_limits, Host::udp_path_change), and their source fragments are sized from the shared ordinary budget; they lower the cache only through correlated PTBs quoting their datagrams or fragments. The Host-owned ICMP Echo adjunct is a Host-trusted writer: the forward delivery an exact, timely Echo Reply certifies for a definitely submitted, unfragmented probe is offered to PathService::confirm_delivery under its revision, hold and first-hop rules (4821-183). T13's Probe mode (Host::udp_send_datagram with UdpSendMode::Probe) lets a datagram application send its own probes above the estimate up to the first-hop MTU, unfragmented with IPv4 DF, but a probe submission writes nothing shared, so applications still have no shared-cache writer. Remaining (T12): probe-outcome reporting (4821-160) in which an ordinary flow's report changes only its own search state and a shared PathService write requires authority granted by the Host owner (4821-195)."
quote = '''
Most of the difficulty in implementing PLPMTUD arises because it needs to be implemented in several different places within a single node. In general, each Packetization Protocol needs to have its own implementation of PLPMTUD. Furthermore, the natural mechanism to share Path MTU information between concurrent or subsequent connections is a path information cache in the IP layer. The various Packetization Protocols need to have the means to access and update the shared cache in the IP layer. This memo describes PLPMTUD in terms of its primary subsystems without fully describing how they are assembled into a complete implementation.
'''

