reason = "Application-protocol responsibility: generating probes in the application's own protocol and determining whether they were lost belong to the application. The Host supplies what such an application needs from the stack: Host UDP flows (Host::udp_open, Host::udp_send_datagram) and the RFC 4821 section 9 send primitive, Probe mode, which sends one unfragmented datagram above the current estimate up to the first-hop MTU (DF on IPv4) with a record of its submission (4821-158). Reporting a probe's outcome to the Host is 4821-160 (T12)."
quote = '''
The disadvantages of relying on IP fragmentation and an adjunct protocol to perform Path MTU Discovery can be overcome by implementing Path MTU Discovery within the application itself, using the application's own protocol. The application must have some suitable method for generating probes and have an accurate and timely mechanism to determine whether the probes were lost.
'''

# 4821-189
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-10.4"
reason = "Application-protocol design recommendation: an echo-plus-pad function is part of an application protocol's message format, which the Host does not define. Host UDP and Probe mode let such an application send a padded probe as one unfragmented datagram above the current estimate (4821-158) and measure each direction itself. The Host's own ICMP Echo adjunct (4821-183) is a Host-level prober, not an application echo-plus-pad protocol."
quote = '''
Ideally, the application protocol includes a lightweight echo function that confirms message delivery, plus a mechanism for padding the messages out to the desired probe size, such that the padding is not echoed. This combination (akin to the SCTP HB plus PAD) is RECOMMENDED because an application can separately measure the MTU of each direction on a path with asymmetrical MTUs.
'''

# 4821-190
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-10.4"
reason = "Application-protocol alternatives (a variable-length echo, padding real messages, alternate segmentation, new message types) are choices of each application protocol. Host UDP carries them, and Probe mode is the primitive for sending any such probe above the current estimate, unfragmented, up to the first-hop MTU (4821-158)."
quote = '''
For protocols that cannot implement PLPMTUD with "echo plus pad", there are often alternate methods for generating probes. For example, the protocol may have a variable length echo that effectively measures minimum MTU of both the forward and return path's, or there may be a way to add padding to regular messages carrying real application data. There may also be alternate ways to segment application data to generate probes, or as a last resort, it may be feasible to extend the protocol with new message types specifically to support MTU discovery.
'''

# 4821-191
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-10.4"
reason = "Advice to application protocol designers about adding ECHO and PAD message types; the Host defines no application message types. Host UDP carries such messages, and Probe mode sends a padded probe unfragmented above the current estimate (4821-158)."
quote = '''
Note that if it is necessary to add new message types to support PLPMTUD, the most general approach is to add ECHO and PAD messages, which permit the greatest possible latitude in how an application- specific implementation of PLPMTUD interacts with other applications and protocols on the same end system.
'''

# 4821-194
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-11"
reason = "Unselected optional ICMP-ignore security configuration; validated PTB processing remains enabled alongside PLPMTUD. This possibility is not a requirement for an ICMP-disable knob or a complete security proof."
quote = '''
Since PLPMTUD is designed for robust operation without any ICMP or other messages from the network, it can be configured to ignore all ICMP messages, either globally or on a per-application basis. In such a configuration, it cannot be attacked unless the attacker can identify and cause probe packets to be lost. Attacking PLPMTUD reduces performance, but not as much as attacking congestion control by causing arbitrary packets to be lost. Such an attacker might do far more damage by completely disrupting specific protocols, such as DNS.
'''

# 4821-195
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-11"
reason = "The condition is active, since the PathService IP-layer cache (079) is shared across protocols, and the rule is enforced: only the Host owner writes shared state. It accepts Host-correlated PTBs quoting a submission actually made on that path incarnation, TCP reports below the owner's proven delivery only after that exact report's quoted-data timeout applied it for the same live owner (never because of its loss-inferred estimate, which also never sizes the report: a legacy IPv4 report without a Next-Hop MTU is corrected against the Host's shared path estimate, RFC 1191 section 5's current PMTU estimate, never the connection's estimate; and with no hold restart before), through Host::service_changes, TCP probe confirmations: a probe span the peer acknowledged, backed by the Host's receipt of its definitely submitted, unfragmented transmission, rechecked against the live owner, path incarnation, negative revision, hold and first hop, and the Host-owned ICMP Echo adjunct's confirmations: an exact, timely Echo Reply to a definitely submitted, unfragmented probe, offered to PathService::confirm_delivery under the same revision, hold and first-hop rules. Endpoint connections and UDP flows have no write path of their own (a UDP flow contributes only Host-correlated PTBs quoting its datagrams, and its Probe-mode sends write nothing shared), so a packetization protocol without Host authority cannot write shared state."
quote = '''
Since packetization protocols may share state with each other, if one packetization protocol (particularly an application) were hostile to other protocols on the same host, it could harm performance in the other protocols by reducing the effective MTU. If a packetization protocol is untrusted, it should not be allowed to write to shared state.
'''
