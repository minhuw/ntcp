# Open full-span implementation/test gaps and true actor/alternative exceptions.

# 4821-005
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-1"
reason = "BCP14 vocabulary declaration is a specification-reader obligation, not packet processing; operative requirements are separately inventoried."
quote = '''
The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this document are to be interpreted as described in [RFC2119].
