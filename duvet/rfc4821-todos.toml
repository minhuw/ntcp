reason = "Partial gap after 0030a96: independent per-connection creation initial_mtu and initial_search_high limits are implemented and validated, with independent initial_search_low and retained administrative high ceiling. No per-route policy service supplies the full per-protocol/per-route recommendation. Optional other-protocol heuristics/defaults do not require TCP to implement other protocols."
