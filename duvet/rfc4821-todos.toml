# 4821-069
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-4"
reason = "The condition is active: PathService is the shared path representation (079). When TCP PLPMTUD confirms a larger size with a definitely submitted, unfragmented probe selected after the 600-second hold, Host::service_changes publishes it through PathService::confirm_delivery and notifies every session on that path: TCP connections apply the raised ordinary budget, where Congestion::set_path_mss keeps byte cwnd and ssthresh so that the raise does not raise the window in bytes (the RFC 4821 section 4 rescaling rule), and Host UDP flows receive the coalesced Host::udp_path_change notification. Selected deviation: PLPMTUD's loss-inferred decreases (black-hole timeouts, failed probes) stay connection-local, because loss is not distinguishable from congestion and the shared representation holds only trusted network facts (Host-correlated PTBs and Host-certified probe receipts); correlated PTB decreases are shared with every session (a TCP report below the connection's proven delivery only once that exact report's quoted-data timeout applies it, whatever the connection's loss-inferred estimate, and with a derived size that never depends on it, since a legacy IPv4 report without a Next-Hop MTU is corrected against the Host's shared path estimate, RFC 1191 section 5's current PMTU estimate, never the connection's estimate)."
quote = '''
If PLPMTUD updates the MTU for a particular path, all Packetization Layer sessions that share the path representation (as described in Section 5.2) SHOULD be notified to make use of the new MTU and make the required congestion control adjustments.
'''


# 4821-076
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-5.2"
reason = "Connection-local discovery is the selected flow model: each TCP connection performs its own PLPMTUD search. Sharing is selected for trusted network facts only: the PathService IP-layer cache (079) shares correlated PTB decreases (a TCP report below the connection's proven delivery only once that exact report's quoted-data timeout applies it, never through loss inference), Host-certified, probe-confirmed TCP sizes and the forward delivery the Host's ICMP Echo adjunct certifies (offered through PathService::confirm_delivery) among flows with a common path representation, and Host::service_changes notifies them, Host UDP flows included. A flow's own eff_pmtu search state (search bounds, probe and verification state, loss-inferred decreases) is not shared, and the adjunct keeps its confirmed lower bound per path apart from the shared ceilings."
quote = '''
This memo uses the concept of a "flow" to define the scope of the Path MTU Discovery algorithms. For many implementations, a flow would naturally correspond to an instance of each protocol (i.e., each connection or session). In such implementations, the algorithms described in this document are performed within each session for each protocol. The observed PMTU (eff_pmtu in Section 7.1) MAY be shared between different flows with a common path representation.
'''

# 4821-077
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc4821#section-5.2"
reason = "Not selected: complete PLPMTUD state and every probe sequence stay with one flow, never spread over several connections. Only trusted network facts (correlated PTB decreases and Host-certified, probe-confirmed sizes) are associated with the path representation, in the PathService IP-layer cache (079)."
quote = '''
Alternatively, PLPMTUD could be implemented such that its complete state is associated with the path representations. Such an implementation could use multiple connections or sessions for each probe sequence. This approach is likely to converge much more quickly in some environments, such as where an application uses many small connections, each of which is too short to complete the Path MTU Discovery process.
'''

