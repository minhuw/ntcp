# Full operative RFC7413 inventory; original published quotations, including explicit errata interpretations in the JSON ledger.

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-2"
quote = '''
To enable applications to exchange data in a TCP handshake, TFO removes the constraint and allows data in SYN packets to be delivered to the application.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-2"
quote = '''
TCP implementations MUST NOT use TFO by default, but only use TFO if requested explicitly by the application on a per-service-port basis.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-2"
quote = '''
Applications need to evaluate TFO applicability as described in Section 6 before using TFO.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-3"
quote = '''
1. The client sends a SYN with a Fast Open option with an empty cookie field to request a cookie.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-3"
quote = '''
2. The server generates a cookie and sends it through the Fast Open option of a SYN-ACK packet.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-3"
quote = '''
3. The client caches the cookie for future TCP Fast Open connections (see below).
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-3"
quote = '''
1. The client sends a SYN with data and the cookie in the Fast Open option.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-3"
quote = '''
2. The server validates the cookie: a. If the cookie is valid, the server sends a SYN-ACK acknowledging both the SYN and the data. The server then delivers the data to the application. b. Otherwise, the server drops the data and sends a SYN-ACK acknowledging only the SYN sequence number.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-3"
quote = '''
If the server accepts the data in the SYN packet, it may send the response data before the handshake finishes.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-3"
quote = '''
The maximum amount is governed by TCP's congestion control [RFC5681].
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-3"
quote = '''
4. The client sends an ACK acknowledging the SYN and the server data. If the client's data is not acknowledged, the client retransmits the data in the ACK packet.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-3"
quote = '''
5. The rest of the connection proceeds like a normal TCP connection. The client can repeat many Fast Open operations once it acquires a cookie (until the cookie is expired by the server).
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1"
quote = '''
The cookie is a MAC tag generated by the server and is opaque to the client; the client simply caches the cookie and passes it back on subsequent SYN packets to open new connections.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1"
quote = '''
The server can expire the cookie at any time to enhance security.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.1"
quote = '''
Kind 1 byte: value = 34 Length 1 byte: range 6 to 18 (bytes); limited by remaining space in the options field. The number MUST be even. Cookie 0, or 4 to 16 bytes (Length - 2)
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.1"
quote = '''
The Fast Open option is used to request or to send a Fast Open Cookie. When a cookie is not present or is empty, the option is used by the client to request a cookie from the server. When the cookie is present, the option is used to pass the cookie from the server to the client or from the client back to the server (to perform a Fast Open).
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.1"
quote = '''
The minimum cookie size is 4 bytes.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.1"
quote = '''
Although the diagram shows a cookie aligned on 32-bit boundaries, alignment is not required.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.1"
quote = '''
Options with invalid Length values or without the SYN flag set MUST be ignored.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
The server is in charge of cookie generation and authentication. The cookie SHOULD be a MAC tag with the following properties. We use "SHOULD" because, in some cases, the cookie may be trivially generated as discussed in Section 7.3.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
1. The cookie authenticates the client's (source) IP address of the SYN packet. The IP address may be an IPv4 or IPv6 address.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
2. The cookie can only be generated by the server and cannot be fabricated by any other parties, including the client.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
3. The generation and verification are fast relative to the rest of SYN and SYN-ACK processing.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
4. A server may encode other information in the cookie and accept more than one valid cookie per client at any given time. But this is server-implementation dependent and transparent to the client.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
5. The cookie expires after a certain amount of time. The reason for cookie expiration is detailed in the "Security Considerations" section (Section 5). This can be done by either periodically changing the server key used to generate cookies or including a timestamp when generating the cookie.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
To gradually invalidate cookies over time, the server can implement key rotation to generate and verify cookies using multiple keys. This approach is useful for large-scale servers to retain Fast Open rolling key updates. We do not specify a particular mechanism because the implementation is server specific.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
- GetCookie(IP_Address): returns a (new) cookie.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
- IsCookieValid(IP_Address, Cookie): checks if the cookie is valid, i.e., it has not expired and the cookie authenticates the client IP address.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
Example Implementation: a simple implementation is to use AES_128 to encrypt the IPv4 (with padding) or IPv6 address and truncate to 64 bits. The server can periodically update the key to expire the cookies. AES encryption on recent processors is fast and takes only a few hundred nanoseconds [RCCJR11].
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.2"
quote = '''
If only one valid cookie is allowed per IP, and the server can regenerate the cookie independently, the best validation process is to simply regenerate a valid cookie and compare it against the incoming cookie. In that case, if the incoming cookie fails the check, a valid cookie is readily available to be sent to the client.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.3"
quote = '''
The client MUST cache cookies from servers for later Fast Open connections. For a multihomed client, the cookies are dependent on the client and server IP addresses. Hence, the client should cache at most one (most recently received) cookie per client and server IP address pair.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.3"
quote = '''
When caching cookies, we recommend that the client also cache the Maximum Segment Size (MSS) advertised by the server. The client can cache the MSS advertised by the server in order to determine the maximum amount of data that the client can fit in the SYN packet in subsequent TFO connections.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.3"
quote = '''
Without a cached server MSS, the amount of data in the SYN packet is limited to the default MSS of 536 bytes for IPv4 [RFC1122] and 1220 bytes for IPv6 [RFC2460].
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.3"
quote = '''
Therefore, the client MAY limit the cached MSS to 1460 bytes for IPv4 or 1440 for IPv6.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.3.1"
quote = '''
The client MUST cache negative responses from the server in order to avoid potential connection failures.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.3.1"
quote = '''
Negative responses include the server not acknowledging the data in the SYN, ICMP error messages, and (most importantly) no response (SYN-ACK) from the server at all, i.e., connection timeout.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.1.3.1"
quote = '''
For any negative responses, the client SHOULD disable Fast Open on the specific path (the source and destination IP addresses and ports) at least temporarily. Since TFO is enabled on a per-service-port basis, but cookies are independent of service ports, the client's cache should include remote port numbers, too.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2"
quote = '''
One predominant requirement of TFO is to be fully compatible with existing TCP implementations, on both the client and server sides.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2"
quote = '''
FastOpenEnabled: default is off. It MUST be turned on explicitly by the application. When this flag is off, the server does not perform any TFO-related operations and MUST ignore all cookie options.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2"
quote = '''
PendingFastOpenRequests: tracks the number of TFO connections in SYN-RCVD state.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2"
quote = '''
If this variable goes over a preset system limit, the server MUST disable TFO for all new connection requests until PendingFastOpenRequests drops below the system limit.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2"
quote = '''
The server keeps a FastOpened flag per connection to mark if a connection has successfully performed a TFO.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.1"
quote = '''
Any client attempting TFO MUST first request a cookie from the server with the following steps:
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.1"
quote = '''
1. The client sends a SYN packet with a Fast Open option with a Length field of 0 (empty cookie field).
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.1"
quote = '''
2. The server responds with a SYN-ACK based on the procedures in the "Server Cookie Handling" section (Section 4.1.2).
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.1"
quote = '''
This SYN-ACK may contain a Fast Open option if the server currently supports TFO for this listener port.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.1"
quote = '''
3. If the SYN-ACK has a Fast Open option with a cookie, the client replaces the cookie and other information as described in the "Client Cookie Handling" section (Section 4.1.3). Otherwise, if the SYN-ACK is first seen and not a (spurious) retransmission, the client MAY remove the server information from the cookie cache. If the SYN-ACK is a spurious retransmission, the client does nothing to the cookie cache for the reasons below.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.1"
quote = '''
We RECOMMEND both the client and the server to retransmit SYN and SYN-ACK packets without the cookie options on timeouts.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.1"
quote = '''
We also RECOMMEND the client to record the set of servers that failed to respond to cookie requests and only attempt another cookie request after a certain period.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
Once the client obtains the cookie from the target server, it can perform subsequent TFO connections until the cookie is expired by the server.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
To open a TFO connection, the client MUST have obtained a cookie from the server:
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
1. Send a SYN packet.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
a. If the SYN packet does not have enough option space for the Fast Open option, abort TFO and fall back to the regular 3WHS.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
Otherwise, include the Fast Open option with the cookie of the server. Include any data up to the cached server MSS or default 536 bytes.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
2. Advance to SYN-SENT state and update SND.NXT to include the data accordingly.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
To deal with network or servers dropping SYN packets with payload or unknown options, when the SYN timer fires, the client SHOULD retransmit a SYN packet without data and Fast Open options.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
1. Initialize and reset a local FastOpened flag. If FastOpenEnabled is false, go to step 5.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
2. If PendingFastOpenRequests is over the system limit, go to step 5.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
3. If IsCookieValid() (in Section 4.1.2) returns false, go to step 5.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
4. Buffer the data and notify the application. Set the FastOpened flag and increment PendingFastOpenRequests.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
5. Send the SYN-ACK packet. The packet MAY include a Fast Open option. If the FastOpened flag is set, the packet acknowledges the SYN and data sequence. Otherwise, it acknowledges only the SYN sequence.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
The server MAY include data in the SYN-ACK packet if the response data is readily available. Some applications may favor delaying the SYN-ACK, allowing the application to process the request in order to produce a response, but this is left up to the implementation.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
6. Advance to the SYN-RCVD state.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
If the FastOpened flag is set, the server MUST follow [RFC5681] (based on [RFC3390]) to set the initial congestion window for sending more data packets.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
If the SYN-ACK timer fires, the server SHOULD retransmit a SYN-ACK segment with neither data nor Fast Open options for compatibility reasons.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
A special case is simultaneous open where the SYN receiver is a client in SYN-SENT state. The protocol remains the same because [RFC793] already supports both data in the SYN and simultaneous open.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
1. If the SYN-ACK has a Fast Open option, an MSS option, or both, update the corresponding cookie and MSS information in the cookie cache.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
2. Send an ACK packet. Set acknowledgment number to RCV.NXT and include the data after SND.UNA if data is available.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
3. Advance to the ESTABLISHED state.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
The client SHOULD retransmit any unacknowledged data in the first ACK packet in step 2.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
If the client has timed out and retransmitted only regular SYN packets, it can heuristically detect paths that intentionally drop SYNs with the Fast Open option or data. If the SYN-ACK acknowledges only the initial sequence and does not carry a Fast Open cookie option, presumably it is triggered by a retransmitted (regular) SYN and the original SYN or the corresponding SYN-ACK was lost.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-4.2.2"
quote = '''
Upon receiving an ACK acknowledging the SYN sequence, the server decrements PendingFastOpenRequests and advances to the ESTABLISHED state. No special handling is required further.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-5.1"
quote = '''
To protect the server, it is important to limit the maximum number of total pending TFO connection requests, i.e., PendingFastOpenRequests (Section 4.2). When the limit is exceeded, the server temporarily disables TFO entirely as described in "Server Cookie Handling" (Section 4.1.2). Then, subsequent TFO requests will be downgraded to regular connection requests, i.e., with the data dropped and only SYNs acknowledged.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-5.1"
quote = '''
For this reason, a TFO server needs to monitor the connections in SYN-RCVD being reset in addition to imposing a reasonable max queue length. Implementations may combine the two, e.g., by continuing to account for those connection requests that have just been reset against the listener's PendingFastOpenRequests until a timeout period has passed.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-5.1.1"
quote = '''
[BRISCOE12] suggested that the server can extend cookie generation to include the TCP timestamp -- GetCookie(IP_Address, Timestamp) -- and implement it by encrypting the concatenation of the two values to generate the cookie. The client stores both the cookie and its corresponding timestamp, and it echoes both in the SYN. The server then implements IsCookieValid(IP_Address, Timestamp, Cookie) by encrypting the IP and timestamp data and comparing it with the cookie value.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-5.1.1"
quote = '''
The server would eventually need to throttle all requests from the IP address just like the current approach.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-5.2"
quote = '''
The best defense is for the server not to respond with data until the handshake finishes.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-6.1"
quote = '''
Nevertheless, a client that cannot handle receiving the same SYN data more than once MUST NOT enable TFO to send data in a SYN. Similarly, a server that cannot accept receiving the same SYN data more than once MUST NOT enable TFO to receive data in a SYN.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-6.2"
quote = '''
To benefit from TFO, the first application data unit (e.g., an HTTP request) needs to be no more than TCP's maximum segment size (minus options used in the SYN).
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-6.2"
quote = '''
To the extent possible, applications SHOULD reuse the connection to take advantage of TCP's built-in congestion control and reduce connection setup overhead.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-6.3.1"
quote = '''
While TFO is motivated by Web applications, the browser should not use TFO to send requests in SYNs if those requests cannot tolerate replays.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-6.3.2"
quote = '''
For Transport Layer Security (TLS) over TCP, it is safe and useful to include a TLS client_hello in the SYN packet to save one RTT in the TLS handshake. There is no concern about violating idempotency. In particular, it can be used alone with the speculative connection above.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-6.3.4"
quote = '''
Servers behind load balancers that accept connection requests to the same server IP address should use the same key such that they generate identical Fast Open cookies for a particular client IP address.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-7.1"
quote = '''
The TFO protocol deals with this problem by falling back to the regular TCP handshake and retransmitting the SYN without data or cookie options after the initial SYN timeout.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-7.1"
quote = '''
Moreover, the implementation is recommended to negatively cache such incidents to avoid recurring timeouts.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-7.2"
quote = '''
A potential solution is to temporarily disable Fast Open if the server observes many SYN-ACK or data losses during the handshake across connections.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-7.3"
quote = '''
cookies are not necessary if the server has application-level protection or is immune to these attacks.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-7.3"
quote = '''
For such applications the server may choose to generate a trivial or even a zero-length cookie to improve performance by avoiding the cookie generation and verification.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-7.3"
quote = '''
If the server believes it's under a DoS attack through other defense mechanisms, it can switch to regular Fast Open for listener sockets.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-8.2"
quote = '''
The best defense may be simply to disable TFO when a host is suspected to be under a SYN flood attack, e.g., the SYN backlog is filled. Once TFO is disabled, normal SYN flood defenses can be applied.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-9"
quote = '''
Current and new implementations SHOULD use option (34).
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#section-9"
quote = '''
Existing implementations that are using experimental option 254 per [RFC6994] with magic number 0xF989 (16 bits) as allocated in the IANA "TCP Experimental Option Experiment Identifiers (TCP ExIDs)" registry by this document, SHOULD migrate to use this new option (34) by default.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.1"
quote = '''
The active open side involves changing or replacing the connect() call, which does not take a user data buffer argument. We recommend replacing the connect() call to minimize API changes, and, hence, applications to reduce the deployment hurdle.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.1"
quote = '''
MSG_FASTOPEN marks the attempt to send data in the SYN like a combination of connect() and sendto(), by performing an implicit connect() operation.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.1"
quote = '''
It blocks until the handshake has completed and the data is buffered.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.1"
quote = '''
For a non-blocking socket, it returns the number of bytes buffered and sent in the SYN packet.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.1"
quote = '''
If the cookie is not available locally, it returns -1 with errno EINPROGRESS, and sends a SYN with a TFO cookie request automatically. The caller needs to write the data again when the socket is connected.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.1"
quote = '''
On errors, it returns the same errno as connect() if the handshake fails.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.1"
quote = '''
An implementation may prefer not to change the sendmsg() call because TFO is a TCP-specific feature. A solution is to add a new socket option, TCP_FASTOPEN, for TCP sockets. When the option is enabled before a connect() operation, sendmsg() or sendto() will perform a Fast Open operation similar to the MSG_FASTOPEN flag described above. This approach, however, requires an extra setsockopt() system call.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.2"
quote = '''
The application only needs to enable the reception of Fast Open requests via a new TCP_FASTOPEN setsockopt() socket option before listen().
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.2"
quote = '''
The option enables Fast Open on the listener socket. The option value specifies the PendingFastOpenRequests threshold, i.e., the maximum length of pending SYNs with data payload. Once enabled, the TCP implementation will respond with TFO cookies per request.
'''

[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc7413#appendix-A.2"
quote = '''
Traditionally, accept() returns only after a socket is connected. But, for a Fast Open connection, accept() returns upon receiving a SYN with a valid Fast Open cookie and data, and the data is available to be read through, e.g., recvmsg(), read().
'''
