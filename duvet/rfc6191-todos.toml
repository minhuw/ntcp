[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6191#appendix-A.1"
reason = "Deliberate Linux-compatible deviation: no startup quiet time. As Linux does after a reboot, a newly started Endpoint assumes no earlier incarnation and admits connections at once; it relies on RFC 9293 section 3.4.1 secret-keyed clock ISNs (an HMAC of the tuple under a per-Endpoint secret plus a 4 us clock), per-connection timestamp offsets (PAWS) and TIME-WAIT for the connections it closed."
quote = """
Firstly, as specified in [RFC0793], hosts must not establish new
connections for a period of 2*MSL (Maximum Segment Lifetime) after they
boot (this is the "quiet time" concept). As a result, in terms of
specifications, this scenario should never occur.
"""

[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6191#section-2"
reason = "Deliberate Linux-compatible deviation: with EndpointConfig::reuse_time_wait, a SYN that fails these checks is not dropped silently. It is the TIME-WAIT's to answer, as any SYN is without reuse: a TIME-WAIT record or a held connection sends its challenge ACK (SND.NXT, RCV.NXT) within the RFC 5961 challenge-ACK budget, takes none of its data and stays in TIME-WAIT with its timer unchanged. Linux's tcp_timewait_state_process returns TCP_TW_ACK_OOW for such a SYN, and tcp_v4_rcv sends the timewait ACK. A SYN that passes the checks but finds no listener is answered the same way, as Linux's TCP_TW_SYN falls through to that ACK."
quote = """
* Otherwise, silently drop the incoming SYN segment, thus leaving the
previous incarnation of the connection in the TIME-WAIT state.
"""

[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6191#section-3"
reason = "Deliberate Linux-compatible deviation: with EndpointConfig::reuse_time_wait, a SYN whose timestamp is older than the previous incarnation's is not ignored. The TIME-WAIT answers it with its challenge ACK within the RFC 5961 challenge-ACK budget, as it answers any SYN without reuse and as Linux's timewait socket does (a PAWS rejection, TCP_TW_ACK_OOW). The previous incarnation stays in TIME-WAIT, and the connection request opens once the client's RST to that ACK has ended the TIME-WAIT, or a retransmission carries a newer timestamp."
quote = """
In the worst-case scenario, an incoming SYN corresponding to a new
incarnation of a connection in the TIME-WAIT contains a timestamp that
is smaller than the last timestamp seen on the previous incarnation of
the connection, the heuristics fail, and the result is no worse than the
current state of affairs. That is, the SYN segment is ignored (as
specified in [RFC1337]), and thus the connection request times out, or
is accepted after future retransmissions of the SYN.
"""
