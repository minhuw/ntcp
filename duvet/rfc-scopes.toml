# Schema 1: each registration states its actual audit boundary, not conformance.
# extraction: all = Duvet keyword extraction; section-3 = RFC9293 policy;
# manual = selected/additional quotations only. inventory is a required tracked
# additions TOML or paragraph JSON ledger. Operative scopes require JSON.
# full-operative additionally requires every non-furniture document span to be
# represented (context is allowed); human review still decides operative meaning.
schema_version = 1

