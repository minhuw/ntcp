extraction = "manual"
inventory = "duvet/rfc791-inventory.json"

[[rfc]]
id = 1122
document_status = "Internet Standard"
scope_kind = "scoped-operative"
scope = "SCOPED: IPv4 codec version/checksum/TTL validation and transport parameters, bounded option parsing, selected source-route origin/final-destination helpers including old-encoding return-route tolerance, Record Route and Timestamp helpers, and the I/O-free ntcp-arp cache's ARP cache validation and per-destination request rate limit (section 2.3.2.1); the section 2.3.2.2 packet queue stays TODO until the embedding integration. RFC6864 amends Identification for atomic datagrams. No full-document or full IPv4 host conformance: forwarding/routing, fragmentation/reassembly, security facilities, address administration, legacy ToS policy, ARP transmission on the wire and general host/socket APIs are outside this inventory."
extraction = "manual"
inventory = "duvet/rfc1122-inventory.json"

[[rfc]]
id = 6864
document_status = "Standards Track"
scope_kind = "scoped-operative"
