# Clause-specific implementation/test gaps and true actor/alternative exceptions.

# 1191-005c
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-2"
reason = "Router discard/ICMP-generation actor; this TCP endpoint consumes these reports but does not forward packets."
quote = '''
If any of the datagrams are too large to be forwarded without fragmentation by some router along the path, that router will discard them and return ICMP Destination Unreachable messages with a code meaning "fragmentation needed and DF set" [7].
'''

# 1191-006a
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-2"
reason = "Optional clear-DF termination is not selected. TCP keeps DF and reduces packet size; not implementing this permission is not a missing feature."
quote = '''
Or, the host may elect to end the discovery process by ceasing to set the DF bit in the datagram headers; it may do so, for example, because it is willing to have datagrams fragmented in some circumstances.
