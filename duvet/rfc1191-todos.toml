# 1191-074
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-6.3"
reason = "T7 PathService invalidates bound paths on route/source/link changes, including shadowing routes. T8 Host rebinds actual native/TUN TCP owners, and T10 Host::service_changes notifies every TCP binding and Host UDP flow of the replacement on the next service pass (a failed rebind stays dirty with bounded backpressure) while the submission barrier refuses held packets the current path no longer carries (dual-family Host and native reservation-race tests). T9 correlation never lets a stale or invalidated path incarnation change an estimate. Remaining T18: ICMP Redirect is decoded as unsupported because no production backend has an IP gateway route; Redirect-driven route changes and their notification arrive with the first real Gateway forwarding in T18, with topology evidence in T19."
quote = '''
PMTU estimates may disappear from the routing table if the per-host routes are removed; this can happen in response to an ICMP Redirect message, or because certain routing-table daemons delete old routes after several minutes. Also, on a multi-homed host a topology change may result in the use of a different source interface. When this happens, if the packetization layer is not notified then it may continue to use a cached PMTU value that is now too small. One solution is to notify the packetization layer of a possible PMTU change whenever a Redirect message causes a route change, and whenever a route is simply deleted from the routing table.
'''

# 1191-082
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-6.4"
reason = "Implemented operative behavior: a DTB-caused retransmission never reduces cwnd or ssthresh, enters or extends recovery, starts PRR or manufactures delivery credit, and it triggers slow start: a notification adding new repair work admits one accepted physical repair packet until acknowledgements show useful progress (a cumulative advance or newly SACKed bytes), then ordinary congestion admission; probe attribution invalidates a quoted probe's size in every accepted class without a congestion response. Dual-family real-receiver scheduler, SACK/RACK/PRR, NewReno and Host reservation tests verify it. Remaining (T23, AC-27): only the standards decision whether the RFC 5681/RFC 4821 rescaling of the byte congestion window by segment count on an MSS decrease (Congestion::set_mss, kept) conflicts with \"should not change the congestion window\"."
quote = '''
Modern TCP implementations incorporate "congestion advoidance" and "slow-start" algorithms to improve performance [4]. Unlike a retransmission caused by a TCP retransmission timeout, a retransmission caused by a Datagram Too Big message should not change the congestion window. It should, however, trigger the slow-start mechanism (i.e., only one segment should be retransmitted until acknowledgements begin to arrive again).
'''

# 1191-083
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-6.4"
reason = "No adjustment rounds the maximum send window to the greatest multiple of PMTU-40 within send-buffer space; the MSS byte budget alone does not establish this recommendation."
quote = '''
TCP performance can be reduced if the sender's maximum window size is not an exact multiple of the segment size in use (this is not the congestion window size, which is always a multiple of the segment size). In many system (such as those derived from 4.2BSD), the segment size is often set to 1024 octets, and the maximum window size (the "send space") is usually a multiple of 1024 octets, so the proper relationship holds by default. If PMTU Discovery is used, however, the segment size may not be a submultiple of the send space, and it may change during a connection; this means that the TCP layer may need to change the transmission window size when PMTU Discovery changes the PMTU value. The maximum window size should be set to the greatest multiple of the segment size (PMTU - 40) that is less than or equal to the sender's buffer space size.
'''

# 1191-085
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-6.5"
reason = "Actor not implemented: ISO TP4 and NFS are not implemented, and no transport in this stack has a stack-managed non-repacketizing retransmission algorithm (TCP repacketizes its retransmissions). Host UDP is a datagram service whose applications own retransmission and datagram sizes, and the Host IP layer does fragment: Host::udp_send_datagram's Fragment mode source-fragments a datagram larger than the connectionless effective size within the peer reassembly guarantee or a stated capability, with DF on every IPv4 fragment (4821-155), so an application that cannot split or shrink a datagram is served by host fragmentation rather than by clearing DF; Host::udp_datagram_limits reports the sizes it may use. A DF-clear route override is T12's (1191-093)."
quote = '''
Some transport protocols (such as ISO TP4 [3]) are not allowed to repacketize when doing a retransmission. That is, once an attempt is made to transmit a datagram of a certain size, its contents cannot be split into smaller datagrams for retransmission. In such a case, the original datagram should be retransmitted without the DF bit set, allowing it to be fragmented as necessary to reach its destination. Subsequent datagrams, when transmitted for the first time, should be no larger than allowed by the Path MTU, and should have the DF bit set.
'''

