reason = "Unselected classical blind upward-estimate heuristic. TCP selects ACK-confirmed RFC4821 probing (Pmtud::target/ack/tick; pmtud_real_probe_ack_restore_failed_encode_and_periodic_retry). RFC4821 section1 implicitly relaxes classical algorithm requirements without updating RFC1191; section4 still governs congestion response. This exception is only for this upward-search alternative, not decreases, PTB holdoff, or 1191-069 retransmit-on-increase."
quote = '''
after the PTMU estimate is decreased because of a Datagram Too Big message. For example, after the PTMU estimate is decreased, the timeout should be set to 10 minutes; once this timer expires and a larger MTU is attempted, the timeout can be set to a much smaller value (say, 2 minutes). In no case should the timeout be shorter than the estimated round-trip time, if this is known.
