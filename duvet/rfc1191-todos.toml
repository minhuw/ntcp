# 1191-013b
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-3"
reason = "Classical blind increase frequency is replaced by ACK-confirmed active search under RFC4821 section1. Converged search and accepted PTB retain a ten-minute hold; this does not waive that holdoff. Unselected classical blind upward-estimate heuristic. TCP selects ACK-confirmed RFC4821 probing (Pmtud::target/ack/tick; pmtud_real_probe_ack_restore_failed_encode_and_periodic_retry). RFC4821 section1 implicitly relaxes classical algorithm requirements without updating RFC1191; section4 still governs congestion response. This exception is only for this upward-search alternative, not decreases, PTB holdoff, or 1191-069 retransmit-on-increase."
quote = '''
Hosts MAY detect increases in Path MTU, but because doing so requires sending datagrams larger than the current estimated PMTU, and because the likelihood is that the PMTU will not have increased, this MUST be done at infrequent intervals.
