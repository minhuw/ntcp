reason = "Continuation of the unselected classical upward-search discussion in 1191-008b. Unselected classical blind upward-estimate heuristic. TCP selects ACK-confirmed RFC4821 probing (Pmtud::target/ack/tick; pmtud_real_probe_ack_restore_failed_encode_and_periodic_retry). RFC4821 section1 implicitly relaxes classical algorithm requirements without updating RFC1191; section4 still governs congestion response. This exception is only for this upward-search alternative, not decreases, PTB holdoff, or 1191-069 retransmit-on-increase."
