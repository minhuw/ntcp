# Clause-specific implementation/test gaps and true actor/alternative exceptions.

# 1191-005c
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-2"
reason = "Router discard/ICMP-generation actor; this TCP endpoint consumes these reports but does not forward packets."
quote = '''
If any of the datagrams are too large to be forwarded without fragmentation by some router along the path, that router will discard them and return ICMP Destination Unreachable messages with a code meaning "fragmentation needed and DF set" [7].
'''

# 1191-006a
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-2"
reason = "Optional clear-DF termination is not selected: a connection performing Path MTU Discovery keeps DF and reduces packet size, and the host never ends discovery by clearing DF. An owner-disabled IPv4 route or path (1191-091/093, the user's recorded decision B) is not this termination either: discovery never runs there, so its packets leave DF clear from the start under the RFC 1122 section 3.3.3 sending limit and no probe is sent. User disposition (recorded): a native connection whose application sets IP_MTU_DISCOVER=IP_PMTUDISC_DONT never performs Path MTU Discovery with its ordinary output, so it ends no discovery process; that output goes as IPv4 TCP packets without DF with Identifications leased from the Host allocator, and its PLPMTUD probes keep DF. Not implementing this permission is not a missing feature."
quote = '''
Or, the host may elect to end the discovery process by ceasing to set the DF bit in the datagram headers; it may do so, for example, because it is willing to have datagrams fragmented in some circumstances.
'''

# 1191-007
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-2"
reason = "Router ICMP-generation change, introduced by historical context; ntcp is a TCP endpoint, not a forwarding router. Host zero-MTU compatibility is covered separately in 1191-014a."
quote = '''
Unfortunately, the Datagram Too Big message, as currently specified, does not report the MTU of the hop for which the rejected datagram was too big, so the source host cannot tell exactly how much to reduce its assumed PMTU. To remedy this, we propose that a currently unused header field in the Datagram Too Big message be used to report the MTU of the constricting hop. This is the only change specified for routers in support of PMTU Discovery.
'''

