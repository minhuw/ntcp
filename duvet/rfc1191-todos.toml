# 1191-089
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-6.5"
reason = "Actor not implemented: ISO TP4 and NFS are not implemented, and no transport in this stack has a stack-managed non-repacketizing retransmission algorithm (TCP repacketizes its retransmissions). Host UDP is a datagram service whose applications own retransmission and datagram sizes, and the Host IP layer does fragment: Host::udp_send_datagram's Fragment mode source-fragments a datagram larger than the connectionless effective size within the peer reassembly guarantee or a stated capability, with DF on every IPv4 fragment (4821-155), so an application that cannot split or shrink a datagram is served by host fragmentation rather than by clearing DF; Host::udp_datagram_limits reports the sizes it may use. An owner-disabled IPv4 route leaves DF clear on TCP, Host::udp_send, Host::udp_send_datagram and Echo reply packets, source fragments included (1191-093)."
