# 1191-074
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-6.3"
reason = "T7 PathService invalidates bound paths on route/source/link changes, including shadowing routes. T8 Host rebinds actual native/TUN TCP owners, and T10 Host::service_changes notifies every TCP binding and Host UDP flow of the replacement on the next service pass (a failed rebind stays dirty with bounded backpressure) while the submission barrier refuses held packets the current path no longer carries (dual-family Host and native reservation-race tests). T9 correlation never lets a stale or invalidated path incarnation change an estimate. T18 receives IPv4 and ICMPv6 Redirects, validated against the destination's current first hop, the arrival link and an exact committed submission, as bounded overrides beneath the selected administrative route (PathService::redirect); installing or replacing one and each event that ends one (route replacement or removal, link removal, neighbor unreachability, loss of the IPv6 Router flag, eviction) invalidates the affected paths, and Host::service_changes then notifies their TCP and UDP clients (ntcp-path tests/redirect.rs, ntcp-host src/tests/redirect.rs). Remaining T19: Linux-router Redirect topology evidence."
quote = '''
PMTU estimates may disappear from the routing table if the per-host routes are removed; this can happen in response to an ICMP Redirect message, or because certain routing-table daemons delete old routes after several minutes. Also, on a multi-homed host a topology change may result in the use of a different source interface. When this happens, if the packetization layer is not notified then it may continue to use a cached PMTU value that is now too small. One solution is to notify the packetization layer of a possible PMTU change whenever a Redirect message causes a route change, and whenever a route is simply deleted from the routing table.
'''

# 1191-082
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-6.4"
reason = "Implemented operative behavior: a DTB-caused retransmission never reduces cwnd or ssthresh, enters or extends recovery, starts PRR or manufactures delivery credit, and it triggers slow start: a notification adding new repair work admits one accepted physical repair packet until acknowledgements show useful progress (a cumulative advance or newly SACKed bytes), then ordinary congestion admission; probe attribution invalidates a quoted probe's size in every accepted class without a congestion response. Dual-family real-receiver scheduler, SACK/RACK/PRR, NewReno and Host reservation tests verify it. Remaining (T23, AC-27): only the standards decision whether the RFC 5681/RFC 4821 rescaling of the byte congestion window by segment count on an MSS decrease (Congestion::set_mss, kept) conflicts with \"should not change the congestion window\"."
quote = '''
Modern TCP implementations incorporate "congestion advoidance" and "slow-start" algorithms to improve performance [4]. Unlike a retransmission caused by a TCP retransmission timeout, a retransmission caused by a Datagram Too Big message should not change the congestion window. It should, however, trigger the slow-start mechanism (i.e., only one segment should be retransmitted until acknowledgements begin to arrive again).
'''

# 1191-085
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc1191#section-6.5"
reason = "Actor not implemented: ISO TP4 and NFS are not implemented, and no transport in this stack has a stack-managed non-repacketizing retransmission algorithm (TCP repacketizes its retransmissions). Host UDP is a datagram service whose applications own retransmission and datagram sizes, and the Host IP layer does fragment: Host::udp_send_datagram's Fragment mode source-fragments a datagram larger than the connectionless effective size within the peer reassembly guarantee or a stated capability, with DF on every IPv4 fragment (4821-155), so an application that cannot split or shrink a datagram is served by host fragmentation rather than by clearing DF; Host::udp_datagram_limits reports the sizes it may use. An owner-disabled IPv4 route leaves DF clear on TCP, Host::udp_send, Host::udp_send_datagram and Echo reply packets, source fragments included (1191-093)."
quote = '''
Some transport protocols (such as ISO TP4 [3]) are not allowed to repacketize when doing a retransmission. That is, once an attempt is made to transmit a datagram of a certain size, its contents cannot be split into smaller datagrams for retransmission. In such a case, the original datagram should be retransmitted without the DF bit set, allowing it to be fragmented as necessary to reach its destination. Subsequent datagrams, when transmitted for the first time, should be no larger than allowed by the Path MTU, and should have the DF bit set.
'''

