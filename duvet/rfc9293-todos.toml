# Exact PMTUD/PLPMTUD clause gaps remain in RFC1191/8201/4821 inventories.

[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc9293#section-3.8.6.1"
reason = "Explicit user-selected Linux-style empty-flight window discovery: when rwnd=0 with queued data and no stream bytes in flight, send an ACK at SND.UNA-1 with no payload. The receiver's ordinary unacceptable-sequence reply reports RCV.NXT and current window; first-probe RTO, exponential backoff, responsiveness and user-resource bounds remain. This differs from the quoted data-octet description and is recorded as a scoped probe-format policy, not claimed as literal satisfaction. Already-outstanding bytes still use the existing data-octet probe/retransmission path with true ACK bounds and ordinary loss/RTO rules. Real IPv4/IPv6/SACK/ECN peer, lost-update, shared ownership, wrap, caller-clock and deferred-acceptance tests cover the selected policy. No generic early-data-retransmission exemption is granted."
quote = '''
The sending TCP peer must regularly transmit at least one octet of
new data (if available), or retransmit to the receiving TCP peer even
if the send window is zero, in order to "probe" the window.
'''

[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc9293#section-3.6.1"
reason = "Deliberate Linux-style deviation: TIME-WAIT lasts ConnectionConfig::time_wait_us, 120 s by default, which lingers 2xMSL only for an MSL of 60 s, not the 2 minutes of section 3.4.2 that CallerTimebase::max_segment_lifetime_us keeps. Any positive value may be configured, for example for benchmarks; Linux fixes 60 s (TCP_TIMEWAIT_LEN), and ntcp_native::NetworkConfig::new, which keeps Linux's TCP defaults, and the packetdrill upstream profile configure it; zero is refused because TIME-WAIT must outlive the instant it begins for the ACK of the peer's FIN to be sent. RFC 6191 timestamp-based TIME-WAIT reuse is unchanged, and the same duration bounds the tuple reservation after a locally generated reset (section 3.5.2)."
quote = '''
When a connection is closed actively, it MUST linger in the TIME-WAIT
state for a time 2xMSL (Maximum Segment Lifetime) (MUST-13).
'''

[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc9293#section-3.6.1"
reason = "Deliberate Linux-style deviation: with EndpointConfig::reuse_time_wait, which ntcp_native::NetworkConfig::new, keeping Linux's TCP defaults, and the packetdrill upstream profile enable, a SYN that passes the RFC 6191 timestamp and sequence checks reopens a TIME-WAIT tuple, and its new connection's ISN lies beyond the largest sequence number of the previous incarnation (condition (1)). The previous incarnation's TIME-WAIT ends when the new connection takes the tuple, as Linux deletes its timewait socket before its listener takes the SYN (tcp_v4_rcv, TCP_TW_SYN): a TIME-WAIT record is deleted and a connection the application still holds becomes CLOSED. Condition (2) is not met: if the SYN was an old duplicate and the new connection fails before establishing, nothing returns to TIME-WAIT and the tuple is free. A SYN refused at reopen (stale, quarantined tuple, no listener, or no room at the listener) leaves the TIME-WAIT unchanged; a stale one, or one no listener takes, the TIME-WAIT answers with its challenge ACK, as Linux's timewait socket does."
quote = '''
However, it MAY accept a new SYN from the remote TCP endpoint to
reopen the connection directly from TIME-WAIT state (MAY-2), if it:
'''

[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc9293#section-3.10.7.2"
reason = "Deliberate Linux-style deviation (tcp_conn_request, without SYN cookies): a listener bounds its SYN queue, its half-open children, and its accept queue, its established children not yet accepted, each by the listen backlog, Linux's sk_max_ack_backlog: either is full once it holds more than the backlog (inet_csk_reqsk_queue_is_full, sk_acceptq_is_full). A SYN finding the SYN queue full is dropped without a SYN-ACK and counted in listen_drops (Linux with tcp_syncookies=0: TCPReqQFullDrop, ListenDrops; Linux's default tcp_syncookies=1 answers it with a cookie SYN-ACK instead, and ntcp has no SYN cookies); a SYN reopening a TIME-WAIT skips that bound, as Linux's tcp_tw_isn does. A SYN then finding the accept queue full is dropped and counted in listen_overflows and listen_drops (ListenOverflows, ListenDrops). The peer retransmits its SYN. Linux's further no-cookie bound, the last quarter of tcp_max_syn_backlog kept for peers with cached metrics (tcp_peer_is_proven), is not implemented: ntcp keeps no such per-destination proof."
quote = '''
ISS
should be selected and a SYN segment sent of the form:
'''

[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc9293#section-3.10.7.4"
reason = "Deliberate Linux-style deviation (tcp_check_req, tcp_v4_syn_recv_sock, tcp_abort_on_overflow=0): an unaccepted passive child whose listener's accept queue is full (it holds more than the listen backlog) does not enter ESTABLISHED on the ACK of its SYN. After the ordinary sequence, PAWS, RST, SYN and ACK-range checks, the segment is dropped whole, its timestamp and data untaken, and counted in listen_overflows and listen_drops (ListenOverflows, ListenDrops); the child stays in SYN-RECEIVED, retransmits its SYN-ACK on its timer within its handshake retransmission limit, and enters ESTABLISHED on the peer's next acceptable ACK once accept() has made room in the queue. A Fast Open child admitted early joins the accept queue at its SYN and is unaffected."
quote = '''
