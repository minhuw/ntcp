[package]
name = "ntcp-socket"
version = "0.0.1"
edition = "2024"
license = "MIT AND GPL-2.0-or-later"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["linux"]
linux = []
packet-test = ["ntcp/packet-test-controls"]
tfo-linux-cookie = ["ntcp/tfo-linux-cookie"]

[dependencies]
ntcp-egress = { path = "../../net/ntcp-egress" }
libc = "0.2"
ntcp-host = { path = "../../stacks/ntcp-host", version = "0.0.1" }
ntcp = { path = "../../stacks/ntcp", version = "0.0.1" }
ntcp-ip = { path = "../../stacks/ntcp-ip", version = "0.0.1" }
ntcp-io = { path = "../../io/ntcp-io", version = "0.0.1" }
ntcp-io-af-packet = { path = "../../io/ntcp-io-af-packet", version = "0.0.1" }
ntcp-io-tun = { path = "../../io/ntcp-io-tun", version = "0.0.1" }

ntcp-ip6 = { path = "../../stacks/ntcp-ip6", version = "0.0.1" }
ntcp-ip-common = { version = "0.0.1", path = "../../stacks/ntcp-ip-common" }
ntcp-icmp = { version = "0.0.1", path = "../../stacks/ntcp-icmp" }
ntcp-ethernet = { version = "0.0.1", path = "../../stacks/ntcp-ethernet" }

[dev-dependencies]
ntcp-host = { path = "../../stacks/ntcp-host", version = "0.0.1", features = ["test-support"] }

[build-dependencies]
cc = "1"
