[package]
name = "ntcp-native"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/minhuw/ntcp"
description = "Caller-driven native Rust TCP connection groups"

[dependencies]
ntcp = { path = "../../stacks/ntcp", version = "0.0.1" }
ntcp-host = { path = "../../stacks/ntcp-host", version = "0.0.1" }
ntcp-io = { path = "../../io/ntcp-io", version = "0.0.1" }
ntcp-ip = { path = "../../stacks/ntcp-ip", version = "0.0.1" }
ntcp-ip6 = { path = "../../stacks/ntcp-ip6", version = "0.0.1" }
ntcp-ethernet = { path = "../../stacks/ntcp-ethernet", version = "0.0.1" }

[dev-dependencies]
ntcp-io-tun = { path = "../../io/ntcp-io-tun", version = "0.0.1" }
