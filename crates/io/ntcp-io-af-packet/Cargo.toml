[package]
name = "ntcp-io-af-packet"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Linux AF_PACKET packet I/O adapter"
repository = "https://github.com/minhuw/ntcp"

[target.'cfg(target_os = "linux")'.dependencies]
ntcp-io = { version = "0.0.1", path = "../ntcp-io" }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
ntcp-io-tun = { version = "0.0.1", path = "../ntcp-io-tun" }
