# implicit-reductions
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc6937#section-4"
reason = "Helper vectors cover pipe/headroom changes, but no complete isolated-multiple-loss connection trace yet asserts skipped voluntary reductions and final pipe equal to the target. Required evidence is actual ACK/output progression with small loss count, bulk queued data and an explicit entry-policy boundary; separate cwnd deflation is not a final-pipe assertion."
quote = '''
Implicit window reductions, due to multiple isolated losses during
recovery, cause later voluntary reductions to be skipped.  For small
numbers of losses, the window size ends at exactly the window chosen
by the congestion control algorithm.
'''

# burst-reductions
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc6937#section-4"
reason = "Banking/resume traces cover stalled output, not burst-loss final-window behavior. No complete burst-loss connection trace yet proves final pipe equals ssthresh while some voluntary reductions remain undone. Required evidence must measure those remaining reductions and final actual pipe under stated entry/estimator assumptions, rather than infer them from helper headroom vectors."
quote = '''
For burst losses, earlier voluntary window reductions can be undone
by sending extra segments in response to ACKs arriving later during
recovery.  Note that as long as some voluntary window reductions are
not undone, the final value for pipe will be the same as ssthresh,
the target cwnd value chosen by the congestion control algorithm.
'''

