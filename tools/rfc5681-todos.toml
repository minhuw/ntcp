reason = "Ordinary transmit uses min(rwnd,cwnd), and Limited Transmit is the section 3.2 controlled exception. Negotiated SACK uses pipe; RACK/TLP/PRR require their modified-recovery scope (RFC8985/6937), not literal Reno inflation. No universal output assertion covers all paths; audit persist and recovery budgets before claiming this global limit. Post-recovery avoidance is now explicitly tested. TLP intentionally sends one probe beyond cwnd under RFC8985, which is not evidence for literal RFC5681."
