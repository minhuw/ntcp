# 5681-015
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-3.1"
reason = "Optional equation (3) is not selected. Congestion::on_ack_with_ecn uses the recommended byte-counting method with acknowledged>=cwnd; initial_slow_start_and_byte_counting asserts that choice. Rounding recommendation is conditional on equation (3), so no quotient is computed or rounded. This does not waive per-RTT or post-recovery obligations."
quote = '''
Another common formula that a TCP MAY use to update cwnd during congestion avoidance is given in equation (3):
'''

# 5681-016
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-3.1"
reason = "Optional equation (3) is not selected. Congestion::on_ack_with_ecn uses the recommended byte-counting method with acknowledged>=cwnd; initial_slow_start_and_byte_counting asserts that choice. Rounding recommendation is conditional on equation (3), so no quotient is computed or rounded. This does not waive per-RTT or post-recovery obligations."
quote = '''
If the above formula yields 0, the result SHOULD be rounded up to 1 byte.
'''

# 5681-029
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc5681#section-3.2"
reason = "Optional outstanding-segment cap on artificial inflation is not selected: on_duplicate_ack adds SMSS with MAX_WINDOW saturation. Mandatory inflation is tested in newreno_partial_and_full_ack. The permission does not require this defense, and it does not waive ACK eligibility or global sending limits."
quote = '''
A TCP MAY therefore limit the number of times cwnd is artificially inflated during loss recovery to the number of outstanding segments (or, an approximation thereof).
'''

