# Agent audit: exact RFC text, whitespace reflow only; no behavior changes.

# 6582:section-1:applicability
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-1"
quote = '''
This document applies to TCP connections that are unable to use the TCP
Selective Acknowledgment (SACK) option, either because the option is not locally
supported or because the TCP peer did not indicate a willingness to use SACK.
'''

# 6582:section-2:recover-definition
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-2"
quote = '''
When in fast recovery, this variable records the send sequence number that must
be acknowledged before the fast recovery procedure is declared to be over.
'''

# 6582:section-3.1:recovery-lifetime
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.1"
quote = '''
The NewReno modification applies to the fast recovery procedure that begins when
three duplicate ACKs are received and ends when either a retransmission timeout
occurs or an ACK arrives that acknowledges all of the data up to and including
the data that was outstanding when the fast recovery procedure began.
'''

# 6582:section-3.2:inherited-procedure
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
The procedures specified in Section 3.2 of [RFC5681] are followed, with the
modifications listed below.
'''

# 6582:section-3.2:initialize
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
When the TCP protocol control block is initialized, recover is set to the
initial send sequence number.
'''

# 6582:section-3.2:third-duplicate
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
When the third duplicate ACK is received, the TCP sender first checks the value
of recover to see if the Cumulative Acknowledgment field covers more than
recover. If so, the value of recover is incremented to the value of the highest
sequence number transmitted by the TCP so far. The TCP then enters fast
retransmit (step 2 of Section 3.2 of [RFC5681]). If not, the TCP does not enter
fast retransmit and does not reset ssthresh.
'''

# 6582:section-3.2:full-ack
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
If this ACK acknowledges all of the data up to and including recover, then the
ACK acknowledges all the intermediate segments sent between the original
transmission of the lost segment and the receipt of the third duplicate ACK. Set
cwnd to either (1) min (ssthresh, max(FlightSize, SMSS) + SMSS) or (2) ssthresh,
where ssthresh is the value set when fast retransmit was entered, and where
FlightSize in (1) is the amount of data presently outstanding.
'''

# 6582:section-3.2:full-exit
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
Exit the fast recovery procedure.
'''

# 6582:section-3.2:option2-burst
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
If the second option is selected, the implementation is encouraged to take
measures to avoid a possible burst of data, in case the amount of data
outstanding in the network is much less than the new congestion window allows. A
simple mechanism is to limit the number of data packets that can be sent in
response to a single acknowledgment.
'''

# 6582:section-3.2:option2-burst
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
reason = "NewReno selects option1, not option2; min(ssthresh,max(FlightSize,SMSS)+SMSS) limits newly usable window and is tested at zero flight. Selectable RFC5681 Reno uses ssthresh but is not RFC6582 option2 selection. General burst recommendation and missing option1 integrated trace remain separately inventoried."
quote = '''
If the second option is selected, the implementation is encouraged to take
measures to avoid a possible burst of data, in case the amount of data
outstanding in the network is much less than the new congestion window allows. A
simple mechanism is to limit the number of data packets that can be sent in
response to a single acknowledgment.
'''

# 6582:section-3.2:partial-classification
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
If this ACK does *not* acknowledge all of the data up to and including recover,
then this is a partial ACK.
'''

# 6582:section-3.2:partial-retransmit
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
In this case, retransmit the first unacknowledged segment.
'''

# 6582:section-3.2:partial-deflation
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
Deflate the congestion window by the amount of new data acknowledged by the
Cumulative Acknowledgment field. If the partial ACK acknowledges at least one
SMSS of new data, then add back SMSS bytes to the congestion window.
'''

# 6582:section-3.2:partial-new-send
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
Send a new segment if permitted by the new value of cwnd.
'''

# 6582:section-3.2:partial-stay
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
Do not exit the fast recovery procedure (i.e., if any duplicate ACKs
subsequently arrive, execute step 4 of Section 3.2 of [RFC5681]).
'''

# 6582:section-3.2:partial-timer
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
For the first partial ACK that arrives during fast recovery, also reset the
retransmit timer.
'''

# 6582:section-3.2:timeout
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
After a retransmit timeout, record the highest sequence number transmitted in
the variable recover, and exit the fast recovery procedure if applicable.
'''

# 6582:section-3.2:strict-reentry
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
Because the acknowledgment field contains the sequence number that the sender
next expects to receive, the acknowledgment "ack_number" covers more than
recover when ack_number - 1 > recover; i.e., at least one byte more of data is
acknowledged beyond the highest byte that was outstanding when fast retransmit
was last entered.
'''

# 6582:section-3.2:threshold
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
quote = '''
This document also does not address issues of adjusting the duplicate
acknowledgment threshold, but assumes the threshold specified in the IETF
standards; the current standard is [RFC5681], which specifies a threshold of
three duplicate acknowledgments.
'''

# 6582:section-4:timeout-guard
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4"
quote = '''
After each retransmit timeout, the highest sequence number transmitted so far is
recorded in the variable recover.
'''

# 6582:section-4:guarded-drop
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4"
quote = '''
For a TCP sender that implements the algorithm specified in Section 3.2 of this
document, the sender does not infer a packet drop from duplicate acknowledgments
in this scenario. As always, the retransmit timer is the backup mechanism for
inferring packet loss in this case.
'''

# 6582:section-4:heuristic-permission
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4"
quote = '''
The TCP sender may use such a heuristic to decide to invoke a fast retransmit in
some cases, even when the three duplicate acknowledgments do not cover more than
recover.
'''

# 6582:section-4:heuristic-permission
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4"
reason = "Optional ACK/timestamp heuristics not selected. on_duplicate_ack never overrides retained recover; tests verify suppression below/equal recovery end. This does not waive initialization, timer or implemented NewReno partial ACK gaps."
quote = '''
The TCP sender may use such a heuristic to decide to invoke a fast retransmit in
some cases, even when the three duplicate acknowledgments do not cover more than
recover.
'''

# 6582:section-4.1:ack-state
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4.1"
quote = '''
If the ACK-based heuristic is used, then following the advancement of the
Cumulative Acknowledgment field, the sender stores the value of the previous
cumulative acknowledgment as prev_highest_ack, and stores the latest cumulative
ACK as highest_ack.
'''

# 6582:section-4.1:ack-state
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4.1"
reason = "Conditional optional ACK heuristic is not selected: no prev_highest_ack/highest_ack heuristic state. Ordinary sequence progress tracking is not evidence for it. Verified erratum6871 corrects the following conditional threshold to3*SMSS."
quote = '''
If the ACK-based heuristic is used, then following the advancement of the
Cumulative Acknowledgment field, the sender stores the value of the previous
cumulative acknowledgment as prev_highest_ack, and stores the latest cumulative
ACK as highest_ack.
'''

# 6582:section-4.1:ack-check
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4.1"
quote = '''
If the Cumulative Acknowledgment field didn't cover more than recover, check to
see if the congestion window is greater than SMSS bytes and the difference
between highest_ack and prev_highest_ack is at most 4*SMSS bytes. If true,
duplicate ACKs indicate a lost segment (enter fast retransmit). Otherwise,
duplicate ACKs likely result from unnecessary retransmissions (do not enter fast
retransmit).
'''

# 6582:section-4.1:ack-check
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4.1"
reason = "Optional ACK heuristic not selected; original RFC quote retains4*SMSS for exact Duvet targeting. Verified technical erratum6871 (2024-03-12, https://www.rfc-editor.org/errata/eid6871) replaces4*SMSS with3*SMSS. Any future implementation must use corrected3*SMSS and test both3 and4 segment advancement; no correction is silently applied to quotes."
quote = '''
If the Cumulative Acknowledgment field didn't cover more than recover, check to
see if the congestion window is greater than SMSS bytes and the difference
between highest_ack and prev_highest_ack is at most 4*SMSS bytes. If true,
duplicate ACKs indicate a lost segment (enter fast retransmit). Otherwise,
duplicate ACKs likely result from unnecessary retransmissions (do not enter fast
retransmit).
'''

# 6582:section-4.2:timestamp-state
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4.2"
quote = '''
If this heuristic is used, the sender stores the timestamp of the last
acknowledged segment.
'''

# 6582:section-4.2:timestamp-state
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4.2"
reason = "Conditional optional timestamp fast-retransmit heuristic is not selected. Negotiated timestamp RTT/PAWS and RACK state are not this NewReno override heuristic."
quote = '''
If this heuristic is used, the sender stores the timestamp of the last
acknowledged segment.
'''

# 6582:section-4.2:timestamp-check
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4.2"
quote = '''
If the Cumulative Acknowledgment field didn't cover more than recover, check to
see if the echoed timestamp in the last non-duplicate acknowledgment equals the
stored timestamp. If true, duplicate ACKs indicate a lost segment (enter fast
retransmit). Otherwise, duplicate ACKs likely result from unnecessary
retransmissions (do not enter fast retransmit).
'''

# 6582:section-4.2:timestamp-check
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-4.2"
reason = "Optional NewReno timestamp override not selected; ordinary fast retransmit uses no stored last-ACK timestamp equality test. RACK timestamp eligibility is different negotiated-SACK behavior, not evidence here."
quote = '''
If the Cumulative Acknowledgment field didn't cover more than recover, check to
see if the echoed timestamp in the last non-duplicate acknowledgment equals the
stored timestamp. If true, duplicate ACKs indicate a lost segment (enter fast
retransmit). Otherwise, duplicate ACKs likely result from unnecessary
retransmissions (do not enter fast retransmit).
'''

# 6582:section-5:hole-fill-ack
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-5"
quote = '''
Echoing [RFC5681], our recommendation is that the data receiver send an
immediate acknowledgment for an out-of-order segment, even when that
out-of-order segment fills a hole in the buffer.
'''

# 6582:section-6:exit-burst
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-6"
quote = '''
In Section 3.2, step 3 above, it is noted that implementations should take
measures to avoid a possible burst of data when leaving fast recovery, in case
the amount of new data that the sender is eligible to send due to the new value
of the congestion window is large.
'''

# 6582:section-6:separate-flag
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-6"
quote = '''
An implementation may want to use a separate flag to record whether or not it is
presently in the fast recovery procedure.
'''

# 6582:section-6:counter-unreliable
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-6"
quote = '''
The use of the value of the duplicate acknowledgment counter for this purpose is
not reliable, because it can be reset upon window updates and out-of- order
acknowledgments.
'''

# 6582:section-6:only-reentry
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-6"
quote = '''
Entry into fast recovery is only possible when the Cumulative Acknowledgment
field covers more than the state variable recover.
'''

# 6582:section-6:wrap-maintenance
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-6"
quote = '''
When updating the Cumulative Acknowledgment field outside of fast recovery, the
state variable recover may also need to be updated in order to continue to
permit possible entry into fast recovery (Section 3.2, step 2). This issue
arises when an update of the Cumulative Acknowledgment field results in a
sequence wraparound that affects the ordering between the Cumulative
Acknowledgment field and the state variable recover.
'''

# 6582:section-6:post-timeout-duplicates
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-6"
quote = '''
When three or more duplicate acknowledgments are received, the Cumulative
Acknowledgment field doesn't cover more than recover, and a new fast recovery is
not invoked, the sender should follow the guidance in Section 4.
'''

# 6582:section-6:no-same-event-growth
[[spec]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-6"
quote = '''
Note that after cwnd is set based on the procedure for exiting fast recovery
(Section 3.2, step 3), cwnd should not be updated until a further event occurs
(e.g., arrival of an ack, or timeout) after this adjustment.
'''
