# Agent audit: exact RFC text, whitespace reflow only; no behavior changes.

# 6298:name-abstract:1
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6298#name-abstract"
reason = "Historical statement upgrading RFC1122, not a distinct algorithm step. Algorithm obligations are inventoried in sections2-5; this exception does not waive their implementation or test gaps."
quote = '''
It expands on the discussion in Section 4.2.3.1 of RFC 1122 and upgrades the
requirement of supporting the algorithm from a SHOULD to a MUST.
'''

# 6298:section-1:1
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6298#section-1"
reason = "Historical statement upgrading RFC1122, not a distinct algorithm step. Algorithm obligations are inventoried in sections2-5; this exception does not waive their implementation or test gaps."
quote = '''
In addition, this document expands on the discussion in Section 4.2.3.1 of RFC
1122 and upgrades the requirement of supporting the algorithm from a SHOULD to a
MUST.
'''

# 6298:section-2:2
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6298#section-2"
reason = "Optional initial value above one second is not selected. RttEstimator::new always initializes one second; rto_min_us controls the sampled floor, not the initial RTO. Configurable post-SYN timeout guard is separately implemented and audited."
quote = '''
A TCP implementation MAY still use this value (or any other value > 1 second).
'''

# 6298:section-5:5
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6298#section-5"
reason = "Optional clearing after repeated backoff is not selected. RttEstimator::backoff changes only RTO; SRTT/variance remain available and the next sample uses subsequent-sample equations. New-connection construction is not repeated-backoff clearing."
quote = '''
Note that a TCP implementation MAY clear SRTT and RTTVAR after backing off the
timer multiple times as it is likely that the current SRTT and RTTVAR are bogus
in this situation.
'''

