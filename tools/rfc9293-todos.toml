target = "https://www.rfc-editor.org/rfc/rfc9293#section-3.7.2"
feature = "BASE-056"
reason = "Adapter/integration gap: lower_mss applies supplied limits; TUN has no ICMP discovery input. PMTUD requires validated fragmentation-needed/Packet-Too-Big feedback tied to a quoted live tuple and transmitted sequence, a path-MTU cache, correct IP/TCP header subtraction and total payload-limit updates, plus stale/spoofed-feedback tests. PLPMTUD additionally requires identified size probes, ACK-confirmed success, bounded search, black-hole fallback and upward adjustment, which lowering-only MSS cannot express. Static configuration and caller hooks provide no discovery evidence; an implementing adapter or probe API is required."
quote = '''
Instead, implementation of Path MTU Discovery (PMTUD) and Packetization Layer
Path MTU Discovery (PLPMTUD) is strongly recommended in order for TCP to
improve segmentation decisions.
'''
