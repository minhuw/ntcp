[[todo]]
target = "https://www.rfc-editor.org/rfc/rfc9293#section-3.9.1.1"
tags = ["MUST-46"]
reason = "MUST-46 [partial]: OPEN rejects configured broadcast addresses, with /0-/32 and address-family tests. ipv4_subnets is a context-independent broadcast denylist, not a routing table: overlapping /24 and /31 contexts can classify the same address differently. Route-dependent validation must occur before OPEN succeeds; the current API does not express that context. Unknown remote subnet broadcasts cannot be inferred from an IP address alone."
quote = '''
A TCP implementation MUST reject as an error a local OPEN call for an
invalid remote IP address (e.g., a broadcast or multicast address)
(MUST-46).
'''

