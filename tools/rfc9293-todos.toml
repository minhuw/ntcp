[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc9293#section-3.10.4"
feature = "BASE-013"
reason = "Implementation gap: shutdown defers SYN-RECEIVED close until establishment. Correct closure needs a handshake-aware FIN path: remember whether SEND was issued, preserve SYN-ACK output/retransmission, emit FIN at ISS+1 transactionally, and distinguish a SYN-only ACK from an ACK covering FIN. Endpoint currently infers handshake completion from leaving SYN states, so that admission/event condition must also change. Required regressions cover passive and simultaneous opens, queued SEND, failed output and both ACK boundaries; changing only the FIN state guard would falsely accept an incomplete handshake."
quote = '''
If no SENDs have been issued and there is no pending data to send, then form a
FIN segment and send it, and enter FIN-WAIT-1 state; otherwise, queue for
processing after entering ESTABLISHED state.
'''

[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc9293#section-3.5.2"
feature = "BASE-044"
reason = "Unimplemented recommendation: local ABORT reports CLOSED and releases the tuple after reset output, as section 3.10.5 prescribes, but retains no reset-origin tuple quarantine. This forgoes the server-load benefit recommended here. Supporting both obligations requires a separately bounded endpoint tombstone lasting 2MSL while the application still observes CLOSED, with capacity, expiry and tuple-reuse tests. Reusing FIN TIME-WAIT as the application state would contradict ABORT semantics. This remains an explicit deviation rather than a conformance exception."
quote = '''
The side of a connection issuing a reset should enter the TIME-WAIT state, as
this generally helps to reduce the load on busy servers for reasons described
in [70].
'''

