target = "https://www.rfc-editor.org/rfc/rfc7323#section-5.7"
reason = "Embedding/behavior gap: core exposes lower_mss/send_ip_payload_limit but no autonomous PMTU discovery; tun example sets DF yet explicitly omits ICMP and cannot discover MTU. Closure: provide bounded ICMP PTB or PLPMTUD integration (IPv4/IPv6), propagate reductions to effective send MSS with options, and assert black-hole/PMTU-change behavior. Merely setting DF/static payload cap is not Path MTU Discovery; TCP/IP layering is not a blanket exception."
quote = '''
Setting the DF bit implies the use of Path MTU Discovery as described
in [RFC1191], [RFC1981], and [RFC4821]; thus, any TCP implementation
that implements PAWS MUST also implement Path MTU Discovery.
'''
