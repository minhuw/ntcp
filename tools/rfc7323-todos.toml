reason = "Default fixed-1ms clock tradeoff (opt-in 1us ticks reduce quantization but do not enforce per-window ticking): byte-per-tick credit enforces the <2^31 sequence-space bound, but a submillisecond path can turn a small peer window several times per tick. Pacing to window/1ms would reduce a one-byte/10us path from100000 to1000bytes/s; synthetic ticks would lose real-time correspondence. Local Karn-safe RTT sampling preserves estimator cadence independently of TSecr. Dynamic per-window pacing is implementable and remains a separate SHOULD policy decision; this is distinct from external clock evidence."
quote = '''
In fact,
in order to be useful to the sender for round-trip timing, the
clock SHOULD tick at least once per window's worth of data, and
even with the window extension defined in Section 2.2, 2^31
bytes must be at least two windows.
'''

