# 6928-015
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-1"
reason = "ConnectionConfig provides Rfc5681/Iw10 selection; existing tests establish default-disabled IW10 and explicit opt-in only. External operational validation remains TODO for supported opt-in usage: the actor enabling IW10 must supply deployment before/after metrics and evidence of reasonable monitoring effort for application/service interactions. External instrumentation is sufficient; no built-in transport API is prescribed. Settable configuration alone does not establish deployment satisfaction."
