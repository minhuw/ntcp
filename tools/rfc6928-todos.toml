# 6928-022
[[exception]]
target = "https://www.rfc-editor.org/rfc/rfc6928#section-12"
reason = "Internet-wide default experiment/research prerequisite is outside a library annotation audit: no default IW10 rollout is proposed, and default prohibition is separately evidenced. Researchers/deployers still owe experiments before broader default enablement; this is not a safety waiver for opt-in sender obligations."
quote = '''
Further experiments are required before a larger initial window shall be enabled by default in the Internet. The existing measurement results indicate that this does not cause significant harm to other traffic. However, widespread use in the Internet could reveal issues not known yet, e.g., regarding fairness or impact on latency- sensitive traffic such as VoIP.
'''

