# 6298:section-3:3
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc6298#section-3"
reason = "One pending end/send-time sample starts on fresh output and clears on covered ACK; timestamp mismatch clears it without sampling, and same-millisecond timestamp reuse can suppress rearming. No assertion establishes >=one eligible measurement per RTT in continuous ACK-clocked flights, delayed/stretched ACKs, invalid echoes, ledger fallback, or RACK-only SACK delivery. Add an integrated sample-count trace per RTT and correct starvation if found; Karn-impossible flights must be identified separately."
quote = '''
A TCP implementation MUST take at least one RTT measurement per RTT (unless that
is not possible per Karn's algorithm).
'''

# 6298:section-5:1
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc6298#section-5"
reason = "Ordinary output re-arms on successful retransmission and advancing ACK restarts; there is no packet-identity assertion proving the no-early-RTO invariant after original/retransmit/ACK/RTO changes. Fast retransmit and negotiated RACK/TLP are distinct early-loss algorithms, not proof of timer conformance. Add last-emission-time assertions for head packets at just-before and exact expiry across partial ACKs, wrap, failed output, configured floors, SACK retransmit and persist transitions; resolve any actual early timer-driven retransmission."
quote = '''
An implementation MUST manage the retransmission timer(s) in such a way that a
segment is never retransmitted too early, i.e., less than one RTO after the
previous transmission of that segment.
'''

