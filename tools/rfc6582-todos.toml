# 6582:section-1:applicability
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-1"
reason = "Applicability gap: with rack/prr enabled and peer permission absent, ordinary fallback is asserted. With local sack=true, rack=false, prr=false, sack_recovery_enabled uses sack_receive alone; a peer configured sack=false sends no SACK feedback, yet ACK processing selects the SACK branch and ordinary eligible duplicate ACKs cannot trigger NewReno. Add an integrated three-duplicate/two-loss test with that asymmetric configuration and correct unavailable-SACK fallback/loss inference. Directional permission is not proof of actual SACK feedback availability; do not waive implemented suppression as an optional algorithm decline. Selectable Reno is not NewReno."
quote = '''
This document applies to TCP connections that are unable to use the TCP
Selective Acknowledgment (SACK) option, either because the option is not locally
supported or because the TCP peer did not indicate a willingness to use SACK.
'''

