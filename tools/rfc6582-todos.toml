reason = "Congestion::new has no ISS argument and initializes recover=None, permitting first-flight fast retransmit without the RFC initial recover comparison. RFC inclusive recover=ISS implies ack_number-1>ISS for entry, whereas current first-flight ACK=ISS+1 enters with no guard (fast_retransmit_uses_three_duplicate_acks_and_fin_shutdown_is_idempotent). Resolve this initial-boundary representation/behavior against literal section3.2 and add explicit ISS/ISS+1/beyond-ISS/wrap assertions; do not waive as optional declined because NewReno is implemented."
