# 6582:section-3.2:strict-reentry
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
reason = "Runtime recover=end exclusive, so ACK>end implements ack_number-1>inclusive highest-byte for recorded recovery epochs, and equality is correctly blocked. Constructor recover=None does not represent initial ISS and is an open initial-entry mismatch. Add explicit initial versus recorded-epoch boundary and wrap assertions after resolving initialization. Existing recorded-epoch tests do not establish initial equivalence."
quote = '''
Because the acknowledgment field contains the sequence number that the sender
next expects to receive, the acknowledgment "ack_number" covers more than
recover when ack_number - 1 > recover; i.e., at least one byte more of data is
acknowledged beyond the highest byte that was outstanding when fast retransmit
was last entered.
'''

