# 6582:section-3.2:initialize
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
reason = "Congestion::new has no ISS argument and initializes recover=None, permitting first-flight fast retransmit without the RFC initial recover comparison. RFC inclusive recover=ISS implies ack_number-1>ISS for entry, whereas current first-flight ACK=ISS+1 enters with no guard (fast_retransmit_uses_three_duplicate_acks_and_fin_shutdown_is_idempotent). Resolve this initial-boundary representation/behavior against literal section3.2 and add explicit ISS/ISS+1/beyond-ISS/wrap assertions; do not waive as optional declined because NewReno is implemented."
quote = '''
When the TCP protocol control block is initialized, recover is set to the
initial send sequence number.
'''

# 6582:section-3.2:third-duplicate
[[TODO]]
target = "https://www.rfc-editor.org/rfc/rfc6582#section-3.2"
reason = "Established loss/timeout guard is stored as exclusive snd_nxt and cleared only by ACK>end; timeout_marker_boundaries_and_wrap verifies equality/above suppression. However initial recover=None bypasses the comparison (initialization TODO). No integrated NewReno trace asserts threshold unchanged under guarded third duplicates after timeout. Resolve initialization and add wire/controller assertions for guarded third dupACKs, ECN sharing and later eligible entry."
quote = '''
When the third duplicate ACK is received, the TCP sender first checks the value
of recover to see if the Cumulative Acknowledgment field covers more than
recover. If so, the value of recover is incremented to the value of the highest
sequence number transmitted by the TCP so far. The TCP then enters fast
retransmit (step 2 of Section 3.2 of [RFC5681]). If not, the TCP does not enter
fast retransmit and does not reset ssthresh.
'''

