[package]
name = "ntcp-packetdrill"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
publish = false
license = "GPL-2.0-or-later"

[lib]
# The plugin only: nothing links an rlib of it, and cargo runs no LTO on a crate that
# builds one besides the cdylib.
crate-type = ["cdylib"]

[features]
default = []
tfo-linux-cookie = ["ntcp-socket/tfo-linux-cookie"]

[dependencies]
libc = "0.2"
ntcp-socket = { path = "../../crates/adapters/ntcp-socket", version = "0.0.1", features = ["packet-test"] }

[dev-dependencies]
ntcp = { path = "../../crates/stacks/ntcp", version = "0.0.1" }
ntcp-ip = { path = "../../crates/stacks/ntcp-ip", version = "0.0.1" }
