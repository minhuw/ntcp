[package]
name = "ntcp-rfc-host"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
ntcp = { path = "../../crates/stacks/ntcp", features = ["tfo-linux-cookie"] }
ntcp-socket = { path = "../../crates/adapters/ntcp-socket", features = ["tfo-linux-cookie"] }
ntcp-io-af-packet = { path = "../../crates/io/ntcp-io-af-packet" }
# The native administration cases configure the runtime's control socket.
ntcp-path-control = { path = "../../crates/adapters/ntcp-path-control" }
# The harness-only staged sender (src/bin/ptb_stage.rs) drives one Host.
ntcp-host = { path = "../../crates/stacks/ntcp-host" }
ntcp-io = { path = "../../crates/io/ntcp-io" }
ntcp-io-tun = { path = "../../crates/io/ntcp-io-tun" }
ntcp-ip = { path = "../../crates/stacks/ntcp-ip" }
ntcp-ip6 = { path = "../../crates/stacks/ntcp-ip6" }
